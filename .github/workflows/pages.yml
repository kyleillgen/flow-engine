# Two sites from one gh-pages branch:
#   main -> https://kyleillgen.github.io/flow-engine/        (live: what people play and share)
#   next -> https://kyleillgen.github.io/flow-engine/next/   (the Try link: work in progress)
name: Pages
on:
  push:
    branches: [main, next]
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live site
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean-exclude: next/
      - name: Try link
        if: github.ref == 'refs/heads/next'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          target-folder: next
