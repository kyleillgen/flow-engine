name: CI
on:
  pull_request:
  push:
    branches: [main, next]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: npm test
      - name: Every game loads, draws and survives play
        run: |
          npm install --no-save puppeteer@23.11.1
          npm run smoke
