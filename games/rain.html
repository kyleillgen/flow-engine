<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="../icon.png">
<meta name="description" content="Raindrops run down the café window on the beat. Tap as each one reaches the sill and a light comes on across the street. A rhythm micro-game that finds your tempo.">
<title>Rain</title>
</head>
<body>
<script src="../engine/flow-engine.js"></script>
<script src="../skins/cafe/cafe-skin.js"></script>
<script src="../shell/space-shell.js"></script>
<script>
// Rain: the big window of the café at night. Raindrops run down the glass, each reaching the
// sill on a whole beat. Tap as it touches and it settles into a bead of light on the sill, and a
// light comes on in the street outside. Biscuit sits on the sill and watches every one. A drop
// you miss slips away under the frame; nothing is lost.
//
// A drop's height is a function of the beat position: y = sill - (at - now) * pace, so it runs at
// a steady pace and lands on the beat. Clean is ±0.3 beat (wider with assist, for drops not yet
// on the glass), perfect ±0.1.
// Fidget (F): every press brings the next drop down at once. Hold then let go to draw in the fog
// on the glass; a full charge draws a heart. Trick shots never score.
(() => {
  "use strict";

  const S = CafeSkin;
  const TAU = Math.PI * 2;
  const PERFECT = 0.1;
  const LEAD = 4; // beats from the top of the glass to the sill
  const PEARLS = ["#ffe2b0", "#f2b56b", "#d9a093", "#a9c3cf", "#a3b596"];

  let W = 0, H = 0, L = {};
  let track = { list: [] }; // the shell's tracker; drops: { at, x, state: "wait" | "caught" | "gone", t, kind, wob }
  let pearls = []; // { x, t, kind } beads on the sill
  let lamps = []; // lights across the street: { x, y, r, c, on }
  let pops = [], sparks = [];
  let lastX = 0, lampNext = 0;
  // Life in the background, on its own clock and never on a beat: the street beyond the glass,
  // and Biscuit's ears and eyes when no drop needs watching
  const life = S.street();
  let stir = 5 + Math.random() * 8;
  let clock = 0, hits = 0;
  let happy = 0, blink = 0, ear = 0;
  let drawing = null; // { t0, full } a finger drawing in the fog

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
  const frac = (v) => v - Math.floor(v);

  function layout(api) {
    W = api.W;
    H = api.H;
    const g = { x: Math.round(W * 0.04), y: Math.round(H * 0.08), w: Math.round(W * 0.92), h: Math.round(H * 0.66) };
    const cat = Math.min(W * 0.17, H * 0.13, 110);
    L = {
      glass: g,
      sill: g.y + g.h,
      top: g.y + g.h * 0.16,
      r: clamp(Math.min(W, H) * 0.026, 8, 15),
      cat,
      catX: g.x + g.w - cat * 0.95,
      laneMin: g.x + g.w * 0.08,
      laneMax: g.x + g.w - cat * 2.1
    };
    L.pace = (L.sill - L.top) / LEAD;
    const r = S.rng(77);
    lamps = [];
    const n = Math.round(clamp((g.w * g.h) / 9000, 10, 40));
    for (let i = 0; i < n; i++) lamps.push({ x: g.x + g.w * (0.04 + r() * 0.92), y: g.y + g.h * (0.3 + r() * 0.6), r: 8 + r() * 16, c: PEARLS[Math.floor(r() * PEARLS.length)], on: -99 });
  }
  const dropY = (d, now) => L.sill - (d.at - now) * L.pace;
  const dropX = (d, now) => d.x + Math.sin(now * 1.3 + d.wob) * L.r * 0.5 * clamp((d.at - now) / LEAD, 0, 1);

  // ---- Sprites --------------------------------------------------------------------------------
  function dropSprite(ctx) {
    const R = Math.round(L.r * 2) / 2;
    return S.sprite(ctx, "drop" + R, R * 4, R * 5, R * 2, R * 2.8, (g) => {
      g.fillStyle = "rgba(8,10,16,0.35)";
      g.beginPath();
      g.ellipse(R * 0.15, R * 0.2, R * 1.05, R * 1.25, 0, 0, TAU);
      g.fill();
      const body = g.createRadialGradient(-R * 0.3, -R * 0.4, R * 0.1, 0, 0, R * 1.2);
      body.addColorStop(0, "rgba(240,246,255,0.85)");
      body.addColorStop(0.5, "rgba(150,170,195,0.5)");
      body.addColorStop(1, "rgba(60,72,95,0.6)");
      g.fillStyle = body;
      g.beginPath();
      g.moveTo(0, -R * 1.9);
      g.bezierCurveTo(R * 0.4, -R * 1.1, R, -R * 0.6, R, 0);
      g.arc(0, 0, R, 0, Math.PI);
      g.bezierCurveTo(-R, -R * 0.6, -R * 0.4, -R * 1.1, 0, -R * 1.9);
      g.fill();
      // a warm lamp caught upside down in the drop
      g.fillStyle = "rgba(255,214,160,0.7)";
      g.beginPath();
      g.ellipse(R * 0.1, R * 0.45, R * 0.35, R * 0.22, 0, 0, TAU);
      g.fill();
      g.fillStyle = "rgba(255,255,255,0.9)";
      g.beginPath();
      g.arc(-R * 0.35, -R * 0.35, R * 0.22, 0, TAU);
      g.fill();
    });
  }

  // The window and the room, baked once per size: the street, the frame, the fog, the sill, the wall below
  function room(g) {
    const gl = L.glass;
    g.fillStyle = "#1c1415";
    g.fillRect(0, 0, W, H);
    S.nightWindow(g, gl.x, gl.y, gl.w, gl.h, 19);
    // condensation along the bottom of the glass
    const fog = g.createLinearGradient(0, gl.y + gl.h * 0.55, 0, gl.y + gl.h);
    fog.addColorStop(0, "rgba(190,200,215,0)");
    fog.addColorStop(1, "rgba(190,200,215,0.13)");
    g.fillStyle = fog;
    g.fillRect(gl.x, gl.y + gl.h * 0.55, gl.w, gl.h * 0.45);
    const r = S.rng(5);
    g.fillStyle = "rgba(220,228,240,0.12)";
    for (let i = 0; i < (gl.w * gl.h) / 300; i++) {
      const x = gl.x + r() * gl.w, y = gl.y + gl.h * (0.55 + r() * r() * 0.45);
      g.fillRect(x, y, 1, 1);
    }
    // the frame: thick wood round the glass and a transom near the top
    g.fillStyle = "#3b2a22";
    g.fillRect(gl.x - 10, gl.y - 10, gl.w + 20, 10);
    g.fillRect(gl.x - 10, gl.y, 10, gl.h);
    g.fillRect(gl.x + gl.w, gl.y, 10, gl.h);
    g.fillRect(gl.x, gl.y + gl.h * 0.14, gl.w, 6);
    g.fillStyle = "rgba(255,220,170,0.08)";
    g.fillRect(gl.x, gl.y + gl.h * 0.14 + 6, gl.w, 1);
    // the sill, deep enough for a cat and a cup
    S.wood(g, gl.x - 22, L.sill, gl.w + 44, 16, 4, "#6a4632");
    g.fillStyle = "rgba(0,0,0,0.4)";
    g.fillRect(gl.x - 22, L.sill + 16, gl.w + 44, 4);
    // the wall below, wainscot panels
    const below = L.sill + 20;
    const lin = g.createLinearGradient(0, below, 0, H);
    lin.addColorStop(0, "#2a1d1c");
    lin.addColorStop(1, "#181011");
    g.fillStyle = lin;
    g.fillRect(0, below, W, H - below);
    g.strokeStyle = "rgba(0,0,0,0.25)";
    g.lineWidth = 2;
    const pw = Math.max(80, W / 6);
    for (let x = gl.x; x + pw * 0.8 < gl.x + gl.w; x += pw) g.strokeRect(x + 8, below + 16, pw - 16, H - below - 46);
  }

  // ---- Effects --------------------------------------------------------------------------------
  function catch_(api, d, perfect, ghost) {
    d.state = "caught";
    d.t = 0;
    const now = api.eng.beatPos();
    const x = dropX(d, Math.min(now, d.at));
    d.cx = x;
    d.cy = dropY(d, Math.min(now, d.at));
    pearls.push({ x, t: 0, kind: d.kind });
    if (pearls.length > 28) pearls.shift();
    // a light across the street comes on
    const lamp = lamps[lampNext++ % lamps.length];
    lamp.on = clock;
    lamp.c = perfect ? "#ffe2b0" : api.color();
    pops.push({ x, y: L.sill, t: 0, big: perfect });
    for (let i = 0; i < (perfect ? 6 : 3) && sparks.length < 50; i++) sparks.push({ x: x + (Math.random() - 0.5) * L.r * 6, y: L.sill - Math.random() * L.r * 3, t: -i * 0.05, c: PEARLS[d.kind] });
    if (!ghost) {
      happy = 0.6;
      if (perfect) {
        ear = 1;
        api.ring(x, L.sill, api.color(), L.r * 6);
      }
    }
  }

  // ---- The five questions ---------------------------------------------------------------------
  // 1-4. The shell's tracker brings a drop to the sill on a whole beat, LEAD beats out and at least
  // two after the last, judges the tap, scores it and plays autopilot; this says what a drop is
  function setup(api) {
    track = api.track({
      ahead: LEAD,
      perfect: PERFECT,
      keep: (d) => d.t < 1.2, // a caught or missed drop stays until its fade is over
      cue: false, // drawn flat on the sill, below
      spawn() {
        let x;
        do x = L.laneMin + Math.random() * (L.laneMax - L.laneMin);
        while (Math.abs(x - lastX) < L.r * 6 && L.laneMax - L.laneMin > L.r * 12);
        lastX = x;
        return { x, t: 0, kind: Math.floor(Math.random() * PEARLS.length), wob: Math.random() * TAU };
      },
      note: (d) => d.kind / PEARLS.length,
      // A tap: the drop touching the sill settles into a bead. Biscuit only reacts to you (and Fidget).
      hit(d, { perfect, ghost, fidget }) {
        catch_(api, d, perfect, ghost && !fidget);
        if (!ghost && ++hits === 16) api.hint("fog", 'hold <span class="pb-kbd">Space</span>, let go: draw on the fogged glass');
        return { x: d.cx, y: L.sill };
      },
      // A drop you miss runs off the sill, and Biscuit blinks
      miss(d) {
        d.state = "gone";
        d.t = 0;
        blink = 0.35;
        api.hint("sill", "tap as the drop touches the sill");
      },
      empty() {
        if (api.style === "fidget") happy = 0.4;
        else pops.push({ x: L.catX - L.cat * 0.6, y: L.sill, t: 0, big: false, dull: true });
      }
    });
  }

  // A hold then release: a finger drawing in the fog; a full charge draws a heart
  function onRelease(api, held) {
    const c = api.chargeOf(held);
    if (c <= 0) return;
    drawing = { t0: clock, full: c >= 1, k: c, x: L.glass.x + L.glass.w * (0.25 + Math.random() * 0.4), y: L.glass.y + L.glass.h * 0.72 };
    if (c >= 1) {
      api.callout("drawn in the fog", W / 2, H * 0.3, "#ffe2b0", 1.05);
      api.eng.chime();
      happy = 1.2;
    }
  }

  // 2. Movement and misses
  function update(dt, api) {
    if (!W) return;
    const now = api.eng.beatPos();
    clock += dt;
    for (const d of track.list) if (d.state !== "wait") d.t += dt;
    for (const p of pearls) p.t += dt;
    for (let i = pops.length - 1; i >= 0; i--) if ((pops[i].t += dt) > 0.7) pops.splice(i, 1);
    for (let i = sparks.length - 1; i >= 0; i--) if ((sparks[i].t += dt) > 0.9) sparks.splice(i, 1);
    if (drawing && clock - drawing.t0 > 4) drawing = null;
    happy = Math.max(0, happy - dt);
    blink = Math.max(0, blink - dt);
    ear = Math.max(0, ear - dt * 3);
    life.update(dt);
    if ((stir -= dt) <= 0) {
      stir = 4 + Math.random() * 9;
      if (Math.random() < 0.5) ear = 1;
      else blink = Math.max(blink, 0.3);
    }
    if (life.flash > 0.95) ear = 1;
  }

  // 5. The look
  function heartPath(ctx, x, y, s, u) {
    // a heart traced by a finger, u 0..1 of the way round
    const pts = [];
    for (let i = 0; i <= 40 * u; i++) {
      const a = (i / 40) * TAU;
      pts.push([x + s * 16 * Math.pow(Math.sin(a), 3) / 16, y - (s * (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a))) / 16]);
    }
    return pts;
  }

  function draw(ctx, api) {
    const now = api.eng.beatPos();
    const gl = L.glass;
    S.layer(ctx, "rain", W, H, room);
    // inside the glass: rain falling outside, lights in the street, drops on the glass
    ctx.save();
    ctx.beginPath();
    ctx.rect(gl.x, gl.y, gl.w, gl.h);
    ctx.clip();
    S.glow(ctx, gl.x + gl.w * 0.5, gl.y + gl.h, gl.w * 0.6, api.color(), 0.12);
    for (const l of lamps) {
      const age = clock - l.on;
      if (age < 0 || age > 24) continue;
      const a = Math.min(1, age * 3) * (age > 18 ? (24 - age) / 6 : 1);
      S.glow(ctx, l.x, l.y, l.r * 2.4, l.c, 0.55 * a);
      S.glow(ctx, l.x, l.y, l.r * 0.8, "#fff4e0", 0.35 * a);
    }
    // the street, far below the drops' lane: people and cars cross it now and then
    life.draw(ctx, gl.x, gl.y, gl.w, gl.h * 0.78, 0.16);
    S.rain(ctx, gl.x, gl.y, gl.w, gl.h, clock, life.rain);
    S.beads(ctx, gl.x, gl.y + gl.h * 0.16, gl.w, gl.h * 0.84, clock, Math.round(14 + 8 * life.rain));
    // the finger drawing in the fog
    if (drawing) {
      const age = clock - drawing.t0, u = clamp(age / 0.8, 0, 1), a = age > 2.5 ? Math.max(0, 1 - (age - 2.5) / 1.5) : 1;
      let pts;
      if (drawing.full) pts = heartPath(ctx, drawing.x, drawing.y, Math.min(gl.w, gl.h) * 0.16, u);
      else {
        pts = [];
        for (let i = 0; i <= 24 * u; i++) pts.push([drawing.x - gl.w * 0.12 + (i / 24) * gl.w * 0.24 * drawing.k, drawing.y + Math.sin((i / 24) * Math.PI * 2) * 14]);
      }
      if (pts.length > 1) {
        ctx.lineCap = ctx.lineJoin = "round";
        for (const [lw, c] of [[11, "rgba(16,20,30,0.45)"], [3, "rgba(230,236,245,0.22)"]]) {
          ctx.globalAlpha = a;
          ctx.strokeStyle = c;
          ctx.lineWidth = lw;
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (const p of pts) ctx.lineTo(p[0], p[1]);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.lineCap = "butt";
        ctx.lineJoin = "miter";
      }
    }
    // the drops: a wet trail behind each, the drop itself, a ring closing on its landing spot
    const drop = dropSprite(ctx);
    let next = null;
    for (const d of track.list) {
      if (d.state === "wait") {
        if (!next || d.at < next.at) next = d;
        const y = dropY(d, now);
        if (y < L.top - L.r * 3) continue;
        const x = dropX(d, now);
        ctx.fillStyle = "rgba(200,212,228,0.08)";
        const t0 = Math.max(L.top, y - L.pace * 1.5);
        ctx.fillRect(d.x - L.r * 0.3, t0, L.r * 0.6, Math.max(0, y - t0));
        S.glow(ctx, x, y, L.r * 3.2, api.color(), 0.35);
        const grow = 0.8 + 0.3 * clamp(1 - (d.at - now) / LEAD, 0, 1);
        S.draw(ctx, drop, x, y, grow);
        const left = d.at - now;
        if (left < 2 && left > -d.window && d === track.next() && api.style !== "fidget") S.cue(ctx, d.x, L.sill, L.r * 1.4 + Math.max(0, left) * L.r * 3, left, PERFECT, api.color(), 0.4, 2);
      } else if (d.state === "gone") {
        // slipping away under the frame
        const a = 1 - d.t / 1.2;
        ctx.globalAlpha = a * 0.6;
        S.draw(ctx, drop, d.x, L.sill - L.r + d.t * 30, 1);
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
    // beads of light along the sill, the newest brightest
    for (let i = 0; i < pearls.length; i++) {
      const p = pearls[i];
      const a = (0.35 + 0.65 * (i / pearls.length)) * Math.min(1, p.t * 4);
      const c = PEARLS[p.kind];
      S.glow(ctx, p.x, L.sill - 3, L.r * 2.2 * (1 + 0.15 * (1 - frac(now))), c, 0.55 * a);
      ctx.fillStyle = S.mix(c, "#fff8ec", 0.5);
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(p.x, L.sill - 3, L.r * 0.45, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (const p of pops) {
      const e = Math.min(1, p.t / 0.6);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(1, 0.4);
      S.softRing(ctx, 0, 0, L.r * (1.5 + (p.big ? 6 : 3.5) * ease(e)), p.dull ? "#8fa3b5" : "#ffe2b0", (1 - e) * (p.dull ? 0.4 : 0.8), 2);
      ctx.restore();
    }
    for (const s of sparks) if (s.t > 0) S.twinkle(ctx, s.x, s.y - s.t * 26, 9, s.c, 1 - s.t / 0.9);

    // a mug on the sill, steaming
    const mx = gl.x + Math.min(70, gl.w * 0.08) + 6, my = L.sill;
    ctx.fillStyle = "#a3b596";
    ctx.beginPath();
    ctx.moveTo(mx - 13, my - 30);
    ctx.lineTo(mx + 13, my - 30);
    ctx.lineTo(mx + 11, my);
    ctx.lineTo(mx - 11, my);
    ctx.fill();
    ctx.strokeStyle = "#a3b596";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(mx + 14, my - 17, 6.5, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
    ctx.fillStyle = "rgba(20,12,12,0.25)";
    ctx.fillRect(mx - 13, my - 30, 9, 30);
    S.steam(ctx, mx, my - 34, 14, clock, 0.8);

    // Biscuit on the sill, watching the next drop come down
    // with no drop near, he watches whatever's going by in the street
    const passing = life.watch();
    const look = next && next.at - now < 2.5 ? clamp((dropX(next, now) - L.catX) / (gl.w * 0.35), -1, 1) : passing !== null ? clamp((gl.x + passing * gl.w - L.catX) / (gl.w * 0.35), -1, 1) : Math.sin(clock * 0.4) * 0.3;
    const close = next && next.at - now < 1.2;
    const eyes = blink > 0 ? "closed" : happy > 0 ? "happy" : close ? "wide" : "open";
    S.cat(ctx, L.catX, L.sill, L.cat, { pose: "sit", eyes, look, tail: clock * (close ? 4 : 1.2), breath: clock * 1.6, ear, paw: happy > 0.3 ? Math.sin(((happy - 0.3) / 0.3) * Math.PI) * 0.5 : 0, side: -1 });

    // the café's lamp, off to the left, warming the room
    S.lamp(ctx, W * 0.08, L.sill + (H - L.sill) * 0.45, Math.max(W, H) * 0.5, 0.55);
    // the hold's charge: an arc closing round, cream when full
    api.drawCharge(L.catX, L.sill - L.cat * 0.9, L.cat * 1.05, null, "#ffe2b0");
  }

  SpaceShell.mount({
    key: "cafeRain",
    title: "Rain",
    hint: "Tap as each drop touches the sill",
    skin: S,
    marquee: S.marquee,
    engine: { track: "RAIN ON GLASS", voice: "LO-FI RHODES", lofi: true, rain: true, minBpm: 72, startBpm: 80 },
    tierNames: ["Warming up", "Drizzle", "Downpour", "Lights on"],
    fidgetPoint: () => ({ x: W / 2, y: L.sill }),
    resize: layout,
    setup,
    onFire: () => track.fire(),
    onRelease,
    update,
    draw
  });
})();
</script>
</body>
</html>
