<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="../icon.png">
<meta name="description" content="Peep the chick crosses a neon highway one lane at a time. Tap as the gap in the traffic reaches the coin and Peep hops through it. A rhythm micro-game that finds your tempo.">
<title>Hop</title>
</head>
<body>
<script src="../engine/flow-engine.js"></script>
<script src="../skins/arcade/arcade-skin.js"></script>
<script src="../shell/space-shell.js"></script>
<script>
// Hop: a lane crossing on one button. Peep, a chunky chick in a tiny helmet, crosses a neon
// highway lane by lane, from traffic island to traffic island. On the beat a gap in the traffic
// slides along the lane ahead with a coin waiting in Peep's path; tap as the gap reaches the
// coin and Peep hops through it and takes the coin. Miss and Peep still scurries across once
// the gap is there, a little flustered, and the coin rolls away. Every eighth island is a
// sidewalk: the lights go green and fireworks go up over the city.
//
// Each gap comes from api.track, on a whole beat, at least two apart, for the next lane. Cars
// cross the crosswalk in Peep's path on whole beats (every beat or every other), so every car's
// position is a function of the beat position and the traffic keeps the time; the cars that
// would cross within 1.3 beats of a gap are simply never there, so the gap is the missing car,
// arriving at the crosswalk on its beat. The shell's timing ring closes on the coin there, gold
// on the perfect beat, and a pad on the island beyond shows where Peep lands. Clean is ±0.3 beat
// (wider with assist, for gaps not yet scheduled), perfect ±0.1.
// Fidget (F): every press brings the next gap to the crosswalk at once and Peep hops through it,
// lane after lane, with a happy flap. Hold then let go for a
// super hop; a full charge sets off fireworks. Trick shots never score.
(() => {
  "use strict";

  const S = ArcadeSkin;
  const PERFECT = 0.1;
  const HOP = 0.4; // beats a hop takes
  const CLEAR = 1.3; // beats either side of a gap with no car
  const INK = "#1a0b2e";
  const CARS = ["#ff4f9a", "#3df5ff", "#7dff5a", "#ff8a3d", "#9b6bff", "#ffd23d"];

  // ---- Pixel art (cars face right; drawn mirrored for the other way) -----------------------
  const CAR = [
    "...kk.....kk....",
    ".dbbbbbbbbbbbbd.",
    "tbbhhhhhbbggggbL",
    "tbhhhhhhbgwegwgL",
    "tbhhhhhhbgeegegL",
    "tbbhhhhhbbggggbL",
    ".dbbbbbbbbbbbbd.",
    "...kk.....kk...."
  ];
  const BUS = [
    "...kk.............kk....",
    ".dbbbbbbbbbbbbbbbbbbbbd.",
    "tbgbgbgbgbgbgbgbbbggggbL",
    "tbbbbbbbbbbbbbbbbgwegwgL",
    "tbbbbbbbbbbbbbbbbgeegegL",
    "tbgbgbgbgbgbgbgbbbggggbL",
    ".dbbbbbbbbbbbbbbbbbbbbd.",
    "...kk.............kk...."
  ];
  const PEEP = {
    stand: ["...rrrr...", "..rRrrrr..", ".rrrrrrrr.", ".yyyyyyyy.", "yywyyyywyy", "yyeyyyyeyy", "yyyyooyyyy", ".yyyooyyy.", ".yyyyyyyy.", "..ff..ff.."],
    blink: ["...rrrr...", "..rRrrrr..", ".rrrrrrrr.", ".yyyyyyyy.", "yyyyyyyyyy", "yyeyyyyeyy", "yyyyooyyyy", ".yyyooyyy.", ".yyyyyyyy.", "..ff..ff.."],
    hop: ["...rrrr...", "..rRrrrr..", ".rrrrrrrr.", "wyyyyyyyyw", "wywyyyywyw", "yyeyyyyeyy", ".yyyooyyy.", "..yyooyy..", "..yyyyyy..", "...f..f..."],
    fluster: ["...rrrr...", "..rRrrrr..", ".rrrrrrrr.", ".yyyyyyyy.", "yyeyyyyeyy", "yywyyyywyy", "yyyyooyyyy", ".yyyooyyy.", ".yyyyyyyy.", ".ff....ff."]
  };
  const COIN = ["..yyyy..", ".yhhyyy.", "yhyyyyyd", "yhyyyyyd", "yhyyyyyd", "yhyyyyyd", ".yyyyyd.", "..dddd.."];
  const carPal = (c) => ({ b: c, h: S.mixHex(c, "#ffffff", 0.35), d: S.mixHex(c, INK, 0.45), g: "#bff9ff", w: "#ffffff", e: INK, t: "#ff3d5a", L: "#fff8c0", k: "#120a1c" });
  const PEEP_PAL = { y: "#ffd23d", r: "#ff4f6a", R: "#ffc0c8", w: "#ffffff", e: INK, o: "#ff8a3d", f: "#ff8a3d" };
  const COIN_PAL = { y: "#ffd23d", h: "#fff6c8", d: "#c07a10" };

  let W = 0, H = 0, F = null, L = {};
  let gaps = null; // api.track: { at, lane, state, window, taken } in gaps.list
  let hopRec = { from: 0, at: -99, good: true, big: 0 }; // the latest hop
  let lanes = new Map(); // lane -> { dir, v (px a beat), period, phase, kinds }
  let shards = [], fireworks = [], coins = [], honks = [];
  let laneCounter = 0, clock = 0, hits = 0, frameDt = 1 / 60, flap = -9, flash = 0;
  let trick = null;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const frac = (v) => v - Math.floor(v);
  const ease = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
  const smooth = (u) => u * u * (3 - 2 * u);

  function layout(api) {
    W = api.W;
    H = api.H;
    F = S.field(W, H);
    // The pixel size from the width and the height, so the pocket still shows two lanes ahead
    const k = clamp(Math.min(Math.floor(F.w / 100), Math.floor(F.h / 60)), 2, 5);
    L = { k, RH: k * 8 + 14, IH: k * 10, cx: F.x + F.w / 2, baseY: F.bottom - k * 22 };
    L.U = L.RH + L.IH;
    lanes.clear(); // car speeds are in pixels, so they follow the width
  }
  const sidewalk = (j) => j % 8 === 0;

  function laneOf(j) {
    let l = lanes.get(j);
    if (!l) {
      const r = S.rng(j * 7919 + 3);
      const bus = r() < 0.3;
      // Every car crosses the crosswalk on a whole beat: each beat, or each other beat for a bus
      l = { dir: j % 2 ? 1 : -1, v: F.w * (0.26 + r() * 0.12), period: bus ? 2 : r() < 0.6 ? 1 : 2, phase: r() < 0.5 ? 0 : 1, bus, color: CARS[Math.floor(r() * CARS.length)], color2: CARS[Math.floor(r() * CARS.length)] };
      lanes.set(j, l);
      if (lanes.size > 40) lanes.delete(lanes.keys().next().value);
    }
    return l;
  }
  // The world: island j is centred at y = -j * U, road j runs between islands j - 1 and j
  const islandY = (j) => -j * L.U;
  const roadY = (j) => -(j - 0.5) * L.U;

  // Peep at beat position now: { j (the island it's on or leaving), y, lift, u }
  function peepAt(now) {
    const h = hopRec;
    const u = clamp((now - h.at) / (HOP * (h.big ? 1.6 : 1)), 0, 1);
    const y = islandY(h.from) + (islandY(h.from + 1) - islandY(h.from)) * smooth(u);
    const lift = Math.sin(Math.PI * u) * L.k * (h.big ? 16 : 6);
    return { j: u >= 1 ? h.from + 1 : h.from, y, lift, u, air: u > 0 && u < 1 };
  }
  // The camera eases after Peep
  function camY(now) {
    const h = hopRec;
    const u = ease((now - h.at) / 1.1);
    return islandY(h.from) + (islandY(h.from + 1) - islandY(h.from)) * u;
  }
  const sy = (y, cam) => L.baseY + (y - cam);

  // ---- The five questions ---------------------------------------------------------------------
  function setup(api) {
    // A gap in the next lane every beat or two; the tracker spawns, judges, misses and autopilots
    gaps = api.track({
      spawn: () => ({ lane: ++laneCounter }),
      note: (g) => (api.style === "fidget" ? 0.3 + Math.random() * 0.4 : 0.25 + (g.lane % 4) * 0.12),
      // Fidget takes the next gap however far off and brings it to the crosswalk now, so Peep
      // moves on at every press and still never hops into traffic
      ready: () => true,
      hit: (g, { perfect, ghost, fidget }) => {
        if (fidget) {
          g.at = api.eng.beatPos();
          happyFlap(api);
        }
        if (!ghost && ++hits === 16) api.hint("super", 'Hold <span class="pb-kbd">Space</span>, let go: a super hop');
        return cross(api, g, true, perfect, ghost);
      },
      miss: (g, counted) => {
        // In Fidget nothing is lost: Peep still hops happily across
        cross(api, g, api.style === "fidget", false, true);
        if (counted) api.hint("gap", "Tap as the gap reaches the coin");
      },
      empty: () => {
        flap = clock;
        if (api.style !== "fidget") return;
        // A Fidget press with no gap coming yet: a happy flap
        happyFlap(api);
      },
      perfect: PERFECT,
      // The ring closes on the coin at the crosswalk, where the gap arrives on its beat
      cueAt: (g) => ({ x: L.cx, y: sy(roadY(g.lane), camY(api.eng.beatPos())) }),
      cueSize: 0.9
    });
  }
  function happyFlap(api) {
    const now = api.eng.beatPos();
    flap = clock;
    S.shards(shards, L.cx, sy(peepAt(now).y, camY(now)) - L.k * 4, 6, ["#ffd23d", "#ffffff"], 120, 60);
  }

  // A gap resolved: Peep hops across now (from the island before it)
  function cross(api, g, good, perfect, ghost) {
    const now = api.eng.beatPos();
    hopRec = { from: g.lane - 1, at: now, good, big: 0 };
    const x = L.cx, y = sy(roadY(g.lane), camY(now));
    if (good && !g.taken) take(api, g, perfect, ghost);
    else if (!good) coins.push({ x, y, vx: (Math.random() < 0.5 ? -1 : 1) * 70, t: 0, lost: true, lane: g.lane });
    if (sidewalk(g.lane)) {
      // Sidewalk: everybody's lights go green, and fireworks
      for (let i = 0; i < 3; i++) fireworks.push({ x: F.x + F.w * (0.2 + 0.3 * i), y: F.y + F.h * (0.15 + Math.random() * 0.15), t: -i * 0.18, c: CARS[(g.lane + i) % CARS.length] });
      flash = 1;
      if (good && !ghost) api.bonus(500, "Safe!", W / 2, H * 0.3);
    }
    // Where the tracker pops the points
    return { x, y };
  }
  function take(api, g, perfect, ghost) {
    g.taken = true;
    const now = api.eng.beatPos();
    const x = L.cx, y = sy(roadY(g.lane), camY(now));
    coins.push({ x, y, vx: 0, t: 0, lost: false, lane: g.lane });
    S.shards(shards, x, y, perfect ? 14 : 8, ["#ffd23d", "#fff6c8", "#ffffff"], 150, 90);
    if (perfect && !ghost) api.ring(x, y, api.color(), 40);
  }

  function onFire(api) {
    gaps.fire();
  }

  // A hold then release: a big flap straight up on the spot; a full charge sets off fireworks
  function onRelease(api, held) {
    const c = api.chargeOf(held);
    if (c <= 0) return;
    trick = { t0: clock, h: L.k * (10 + c * 14), dur: 0.45 + c * 0.35 };
    if (c >= 1) {
      for (let i = 0; i < 5; i++) fireworks.push({ x: F.x + F.w * (0.1 + 0.2 * i), y: F.y + F.h * (0.12 + Math.random() * 0.2), t: -i * 0.12, c: CARS[i % CARS.length] });
      api.callout("Fireworks", W / 2, H * 0.36, "#ffd23d", 1.1);
      api.eng.chime();
    }
  }

  function update(dt, api) {
    if (!W) return;
    const now = api.eng.beatPos();
    clock += dt;
    frameDt = dt;
    for (let i = coins.length - 1; i >= 0; i--) if ((coins[i].t += dt) > 0.9) coins.splice(i, 1);
    for (let i = fireworks.length - 1; i >= 0; i--) if ((fireworks[i].t += dt) > 1.4) fireworks.splice(i, 1);
    if (trick && clock - trick.t0 > trick.dur) trick = null;
    flash = Math.max(0, flash - dt * 0.8);
    street.update(dt);
    // Now and then a car honks hello as it passes (a little "beep" bubble)
    if (Math.random() < dt * 0.5 && honks.length < 2) honks.push({ lane: peepAt(now).j + 1 + Math.floor(Math.random() * 4), t: 0, side: Math.random() });
    for (let i = honks.length - 1; i >= 0; i--) if ((honks[i].t += dt) > 1) honks.splice(i, 1);
  }

  // ---- The look ---------------------------------------------------------------------------
  function backdrop(ctx, api) {
    const hue = api.color();
    S.layer(ctx, "hop" + api.tier, W, H, (g) => {
      g.fillStyle = "#0a0614";
      g.fillRect(0, 0, W, H);
      S.sides(g, W, H, F, ["#ffd23d", "#ff8a3d", "#ff4f9a"]);
    });
  }
  // A road lane, baked once a width: dark asphalt with pixel grit and a glowing kerb each side
  function roadSprite(ctx, tint) {
    return S.sprite(ctx, "road" + F.w + "x" + L.RH + tint, F.w, L.RH, 0, L.RH / 2, (g) => {
      const lin = g.createLinearGradient(0, -L.RH / 2, 0, L.RH / 2);
      lin.addColorStop(0, S.mix("#1c1530", tint, 0.08));
      lin.addColorStop(0.5, S.mix("#151026", tint, 0.04));
      lin.addColorStop(1, S.mix("#1c1530", tint, 0.08));
      g.fillStyle = lin;
      g.fillRect(0, -L.RH / 2, F.w, L.RH);
      const r = S.rng(5);
      for (let i = 0; i < (F.w * L.RH) / 60; i++) {
        g.fillStyle = r() > 0.5 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.25)";
        g.fillRect(Math.floor(r() * F.w), Math.floor(-L.RH / 2 + r() * L.RH), L.k / 2 + 0.5, L.k / 2 + 0.5);
      }
      g.fillStyle = S.rgba(tint, 0.3);
      g.fillRect(0, -L.RH / 2, F.w, 1);
      g.fillRect(0, L.RH / 2 - 1, F.w, 1);
    });
  }
  function islandSprite(ctx, walk, hue) {
    return S.sprite(ctx, "isle" + F.w + "x" + L.IH + (walk ? "w" : "") + hue, F.w, L.IH + 24, 0, L.IH / 2 + 12, (g) => {
      const top = -L.IH / 2;
      g.fillStyle = walk ? "#2a2240" : "#211a36";
      g.fillRect(0, top, F.w, L.IH);
      // Kerb stones in pixel tiles
      for (let x = 0; x < F.w; x += L.k * 4) {
        g.fillStyle = (x / (L.k * 4)) % 2 ? "#3a3058" : "#463a6a";
        g.fillRect(x, top, L.k * 4, L.k);
        g.fillRect(x, -top - L.k, L.k * 4, L.k);
      }
      if (walk) {
        // A neon edge along the sidewalk, glowing up into the road
        S.haloed(g, hue, (g, c, core) => {
          g.fillStyle = c;
          g.fillRect(0, top - (core ? 0.5 : 1), F.w, core ? 1 : 2);
          g.fillRect(0, -top - (core ? 0.5 : 1), F.w, core ? 1 : 2);
        });
      } else {
        // Little bollards with reflectors
        for (let x = L.k * 10; x < F.w; x += L.k * 26) {
          g.fillStyle = "#5a4c80";
          g.fillRect(x, -L.k * 1.5, L.k * 2, L.k * 3);
          g.fillStyle = "#ff8a3d";
          g.fillRect(x, -L.k * 1.5, L.k * 2, L.k);
        }
      }
    });
  }

  function drawCars(ctx, j, y, now, gapAt) {
    const l = laneOf(j);
    const kind = l.bus ? BUS : CAR;
    const cw = kind[0].length * L.k;
    const reach = (F.w / 2 + cw) / l.v; // beats from the path to off screen
    // Cars cross Peep's path at times phase + i * period
    const i0 = Math.ceil((now - reach - l.phase) / l.period), i1 = Math.floor((now + reach - l.phase) / l.period);
    for (let i = i0; i <= i1; i++) {
      const tc = l.phase + i * l.period;
      if (gapAt !== null && Math.abs(tc - gapAt) < CLEAR) continue;
      const x = L.cx + l.dir * (now - tc) * l.v;
      const color = i % 2 ? l.color : l.color2;
      const spr = S.pix(ctx, (l.bus ? "bus" : "car") + color, kind, carPal(color), L.k, { glow: color, bloom: 6 });
      // Headlights throw light ahead
      S.glow(ctx, x + l.dir * cw * 0.62, y, L.k * 9, "#fff1a8", 0.35);
      ctx.save();
      ctx.translate(x, y);
      if (l.dir < 0) ctx.scale(-1, 1);
      S.draw(ctx, spr, 0, 0);
      ctx.restore();
      S.glow(ctx, x - l.dir * cw * 0.5, y, L.k * 4, "#ff3d5a", 0.4);
    }
  }

  // Now and then, over the city: a flock of birds, a searchlight sweeping by, a drone blinking
  // across, a cat strolling along an island at the edge
  const CAT = ["k...k...", "kk.kk...", "kwkwk...", "kkkkk..k", ".kkkkkkk", ".kkkkkk.", ".k.k.k.k"];
  const street = S.happenings([
    {
      dur: 4,
      draw(ctx, e, u) {
        ctx.fillStyle = "#fff4e0";
        for (let i = 0; i < 5; i++) {
          const x = e.side > 0 ? F.x - 30 + u * (F.w + 60) - i * 9 : F.x + F.w + 30 - u * (F.w + 60) + i * 9;
          const y = F.y + F.h * (0.12 + e.seed * 0.2) + Math.abs(i - 2) * 6;
          ctx.globalAlpha = 0.35;
          const w = frac(u * 14 + i * 0.3) < 0.5;
          ctx.fillRect(Math.round(x - 3), Math.round(y - (w ? 1 : 0)), 3, 1);
          ctx.fillRect(Math.round(x + 1), Math.round(y - (w ? 1 : 0)), 3, 1);
        }
      }
    },
    {
      dur: 2.4,
      draw(ctx, e, u) {
        const x = F.x + F.w * (e.side > 0 ? u : 1 - u) * 1.4 - F.w * 0.2;
        const g = ctx.createLinearGradient(x - 50, 0, x + 50, 0);
        g.addColorStop(0, "rgba(255,244,224,0)");
        g.addColorStop(0.5, "rgba(255,244,224,0.06)");
        g.addColorStop(1, "rgba(255,244,224,0)");
        ctx.fillStyle = g;
        ctx.fillRect(x - 50, F.y, 100, F.h);
      }
    },
    {
      dur: 7,
      draw(ctx, e, u) {
        const x = e.side > 0 ? F.x - 10 + u * (F.w + 20) : F.x + F.w + 10 - u * (F.w + 20);
        const y = F.y + F.h * (0.08 + e.seed * 0.15) + Math.sin(u * 12) * 3;
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = "#6a5a8a";
        ctx.fillRect(Math.round(x - 4), Math.round(y), 8, 2);
        S.glow(ctx, x, y + 2, 5, frac(u * 10) < 0.5 ? "#ff3d5a" : "#3df5ff", 0.8);
      }
    },
    {
      dur: 8,
      draw(ctx, e, u, cam) {
        const j = peepAt(clockBeat).j;
        const y = sy(islandY(j), cam) - L.k * 2;
        const x = e.side > 0 ? F.x + 6 + u * F.w * 0.3 : F.x + F.w - 6 - u * F.w * 0.3;
        ctx.globalAlpha = Math.min(1, Math.sin(u * Math.PI) * 3) * 0.7;
        ctx.translate(Math.round(x), Math.round(y + (frac(u * 16) < 0.5 ? 0 : -1)));
        if (e.side < 0) ctx.scale(-1, 1);
        S.draw(ctx, S.pix(ctx, "cat", CAT, { k: "#5a4c80", w: "#7dff5a" }, Math.max(1, L.k - 1), { bloom: 0, light: 0 }), 0, 0);
      }
    }
  ]);
  let clockBeat = 0;

  function draw(ctx, api) {
    const now = api.eng.beatPos();
    clockBeat = now;
    backdrop(ctx, api);
    const cam = camY(now);
    const hue = api.color();
    ctx.save();
    ctx.beginPath();
    ctx.rect(F.x, F.y, F.w, F.h);
    ctx.clip();
    // Rows from the bottom of the screen to the top
    const jLo = Math.floor(-(F.bottom - L.baseY + cam) / L.U) - 1;
    const jHi = Math.ceil((L.baseY - F.y - cam) / L.U) + 1;
    const gapFor = new Map();
    for (const g of gaps.list) if (g.state === "wait") gapFor.set(g.lane, g.at);
    // Gaps that have resolved still keep their lane clear until the cars have moved on
    for (const g of gaps.list) if (g.state !== "wait" && !gapFor.has(g.lane)) gapFor.set(g.lane, g.at);
    for (let j = Math.max(0, jLo); j <= jHi; j++) {
      const iy = sy(islandY(j), cam);
      if (j > 0) {
        const ry = sy(roadY(j), cam);
        S.draw(ctx, roadSprite(ctx, j % 5 === 2 ? "#ff4f9a" : hue), F.x, ry);
        // Dashes down the middle of the lane, drifting with the traffic
        const l = laneOf(j);
        ctx.fillStyle = "rgba(255,244,224,0.12)";
        const step = L.k * 12, off = (((now * l.v * 0.0) % step) + step) % step;
        for (let x = F.x + off - step; x < F.x + F.w; x += step) if (Math.abs(x + L.k * 3 - L.cx) > L.k * 9) ctx.fillRect(x, ry - 0.5, L.k * 6, 1);
        // The crosswalk in Peep's path: where the cars pass on the beat, and where the gap comes
        ctx.fillStyle = "rgba(255,244,224,0.1)";
        for (let x = -3; x <= 3; x++) ctx.fillRect(L.cx + x * L.k * 2 - L.k / 2, ry - L.RH / 2 + 3, L.k, L.RH - 6);
      }
      S.draw(ctx, islandSprite(ctx, sidewalk(j), hue), F.x, iy);
      if (sidewalk(j) && j > 0) {
        // Street lamps on the sidewalk, and a painted number
        for (const fx of [0.12, 0.88]) S.glow(ctx, F.x + F.w * fx, iy, L.k * 14, flash ? "#7dff5a" : "#ffd23d", 0.35 + flash * 0.4);
        S.text(ctx, "Lane " + j, F.x + F.w * 0.24, iy, L.k * 0.5, hue, { alpha: 0.6, chrome: false });
      }
    }
    // The gap ahead: a coin waiting on the crosswalk, a window of light travelling in the gap,
    // and the landing pad on the island beyond
    const next = gaps.next();
    for (const g of gaps.list) {
      if (g.state !== "wait") continue;
      if (g === next) {
        const iy = sy(islandY(g.lane), cam), u = clamp(1 - (g.at - now) / 2, 0, 1);
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = hue;
        ctx.globalAlpha = 0.15 + 0.35 * u;
        for (const [px, py] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
          ctx.fillRect(L.cx + px * L.k * 6 - (px > 0 ? L.k * 2 : 0), iy + py * L.k * 3 - (py > 0 ? L.k : 0), L.k * 2, L.k);
          ctx.fillRect(L.cx + px * L.k * 6 - (px > 0 ? L.k : 0), iy + py * L.k * 3 - (py > 0 ? L.k * 2 : 0), L.k, L.k * 2);
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      const ry = sy(roadY(g.lane), cam);
      if (ry < F.y - L.U || ry > F.bottom + L.U) continue;
      const l = laneOf(g.lane);
      const left = g.at - now;
      const gx = L.cx - l.dir * left * l.v;
      const a = clamp((2.5 - left) / 1, 0, 1);
      S.glow(ctx, gx, ry, L.RH * 1.2, hue, 0.22 * a);
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.22 * a;
      ctx.fillStyle = hue;
      ctx.fillRect(gx - L.k * 10, ry - L.RH / 2 + 2, L.k * 20, L.RH - 4);
      // The window's edges, bright, so you can see it meet the crosswalk
      ctx.globalAlpha = 0.7 * a;
      ctx.fillRect(gx - L.k * 10, ry - L.RH / 2 + 2, 2, L.RH - 4);
      ctx.fillRect(gx + L.k * 10 - 2, ry - L.RH / 2 + 2, 2, L.RH - 4);
      // Chevrons at the gap's edges, pointing the way it's going
      ctx.globalAlpha = 0.8 * a;
      for (const e of [-1, 1]) {
        const ex = gx + e * L.k * 10;
        for (const [cx, cy] of [[0, -2], [1, -1], [2, 0], [1, 1], [0, 2]]) ctx.fillRect(ex + l.dir * (cx - 1) * L.k - L.k / 2, ry + cy * L.k - L.k / 2, L.k, L.k);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      if (!g.taken && left < 2.4) {
        const bob = Math.sin(clock * 5) * L.k * 0.6;
        const spin = Math.abs(Math.cos(clock * 3));
        S.glow(ctx, L.cx, ry, L.k * (10 + (left < 0.2 ? 6 : 0)), "#ffd23d", 0.5 + 0.3 * (1 - frac(now)));
        ctx.save();
        ctx.translate(L.cx, ry + bob);
        ctx.scale(0.3 + 0.7 * spin, 1);
        S.draw(ctx, S.pix(ctx, "coin", COIN, COIN_PAL, L.k * 0.75, { glow: "#ffd23d", bloom: 6 }), 0, 0);
        ctx.restore();
      }
    }
    for (let j = Math.max(1, jLo); j <= jHi; j++) {
      if (sidewalk(j - 0) && false) continue;
      drawCars(ctx, j, sy(roadY(j), cam), now, gapFor.has(j) ? gapFor.get(j) : null);
    }
    street.draw(ctx, cam);
    // Honks: a little BEEP over a car
    for (const h of honks) {
      const y = sy(roadY(h.lane), cam) - L.RH * 0.7 - h.t * 10;
      if (y < F.y) continue;
      S.text(ctx, "beep", F.x + F.w * (0.15 + h.side * 0.7), y, L.k * 0.5, "#fff4e0", { alpha: 1 - h.t, chrome: false });
    }
    // Coins: taken ones fly up to the score, lost ones roll off
    for (const c of coins) {
      const u = c.t / 0.9;
      if (c.lost) {
        S.draw(ctx, S.pix(ctx, "coin", COIN, COIN_PAL, L.k * 0.75, { glow: "#ffd23d", bloom: 6 }), c.x + c.vx * c.t * 2, c.y + Math.sin(c.t * 9) * 2);
      } else {
        S.twinkle(ctx, c.x, c.y - u * 60, L.k * 6 * (1 - u), "#ffd23d", 1 - u);
        S.text(ctx, "+", c.x + 10, c.y - 14 - u * 40, L.k * 0.6, "#ffd23d", { alpha: 1 - u });
      }
    }

    // Peep: hop arc with a shadow; flustered on a miss, a flap on any press
    const p = peepAt(now);
    let lift = p.lift, spin = 0;
    if (trick) {
      const u = (clock - trick.t0) / trick.dur;
      lift += Math.sin(Math.PI * u) * trick.h;
      spin = u;
    }
    const py = sy(p.y, cam);
    const flapping = clock - flap < 0.25;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(L.cx, py + L.k * 5, L.k * (5 - lift / (L.k * 8)), L.k * 1.6, 0, 0, Math.PI * 2);
    ctx.fill();
    const face = p.air || flapping ? (hopRec.good ? "hop" : "fluster") : frac(clock * 0.27) < 0.05 ? "blink" : "stand";
    S.glow(ctx, L.cx, py - lift, L.k * 14, "#ffd23d", 0.25);
    ctx.save();
    ctx.translate(L.cx, py - lift - (flapping ? L.k * 2 : 0));
    if (spin) ctx.scale(Math.cos(spin * Math.PI * 2), 1);
    const land = now - hopRec.at - HOP;
    if (land > 0 && land < 0.2) ctx.scale(1 + 0.15 * Math.sin((land / 0.2) * Math.PI), 1 - 0.12 * Math.sin((land / 0.2) * Math.PI));
    S.draw(ctx, S.pix(ctx, "peep" + face, PEEP[face], PEEP_PAL, L.k + 1, { glow: "#ffd23d", bloom: 8 }), 0, 0);
    ctx.restore();
    // The charge: pixel pips filling round Peep
    const c = api.started ? api.charge : 0;
    if (c > 0) {
      const n = 12, color = c >= 1 ? "#ffd23d" : "#3df5ff";
      for (let i = 0; i < Math.floor(c * n); i++) {
        const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
        S.glow(ctx, L.cx + Math.cos(a) * L.k * 10, py - lift + Math.sin(a) * L.k * 10, L.k * 2.5, color, 1);
      }
    }
    // Fireworks: a rising spark, then a ring of pixel stars
    for (const f of fireworks) {
      if (f.t < 0) continue;
      if (f.t < 0.35) {
        const u = f.t / 0.35;
        S.glow(ctx, f.x, f.y + (1 - u) * F.h * 0.4, L.k * 3, f.c, 1);
      } else {
        const u = (f.t - 0.35) / 1.05;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          const r = ease(u) * L.k * 26;
          const x = f.x + Math.cos(a) * r, y = f.y + Math.sin(a) * r + u * u * 20;
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = 1 - u;
          ctx.fillStyle = i % 3 ? f.c : "#ffffff";
          ctx.fillRect(x - L.k * 0.75, y - L.k * 0.75, L.k * 1.5, L.k * 1.5);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
        }
        S.glow(ctx, f.x, f.y, L.k * 30 * (1 - u), f.c, 0.4 * (1 - u));
      }
    }
    S.drawShards(ctx, shards, frameDt);
    ctx.restore();
  }

  SpaceShell.mount({
    key: "hop",
    title: "Hop",
    hint: "Tap as the gap reaches the coin",
    skin: S,
    marquee: S.attract,
    setup,
    engine: {},
    tierNames: ["Finding your rhythm", "Hop to it", "Rush hour", "Road runner"],
    onPhrase: (api) => {
      for (let i = 0; i < 2; i++) fireworks.push({ x: F.x + F.w * (0.3 + 0.4 * i), y: F.y + F.h * 0.18, t: -i * 0.2, c: CARS[i * 2] });
    },
    fidgetPoint: (api) => ({ x: L.cx, y: L.baseY }),
    resize: layout,
    onFire,
    onRelease,
    update,
    draw
  });
})();
</script>
</body>
</html>
