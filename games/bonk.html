<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="../icon.png">
<meta name="description" content="Pip the spark bounces between Slab and a wall of sleepy Blocklings. Tap as Pip lands on Slab and the bonk breaks a brick. A rhythm micro-game that finds your tempo.">
<title>Bonk</title>
</head>
<body>
<script src="../engine/flow-engine.js"></script>
<script src="../skins/arcade/arcade-skin.js"></script>
<script src="../shell/space-shell.js"></script>
<script>
// Bonk: a brick-breaker on one button. Pip, a round spark with big eyes, rides between Slab (a
// hover-paddle with headlight eyes) and a wall of Blocklings, sleepy bricks who'd love to be
// bonked. Slab always catches Pip; tap as Pip lands and the bonk sends Pip up to break a brick.
// Miss and Pip only plinks off it. Every eighth clean bonk in a row Pip goes Mega: a fireball
// that tunnels the whole column. The wall refills from the top, so it never ends.
//
// Landings come from api.track: on whole beats, at least two apart. Pip's flight is straight
// lines, up one leg and down the other, as a function of the beat position; Slab glides under
// the next landing. Clean is ±0.3 beat (wider with assist, for landings not yet scheduled),
// perfect ±0.1. The shell's timing ring closes on Pip's touchdown spot, gold on the perfect beat.
// Fidget (F): every press fires a spark from Slab that breaks a brick. Hold then let go for a
// laser; a full charge fires three. Trick shots never score.
(() => {
  "use strict";

  const S = ArcadeSkin;
  const TAU = Math.PI * 2;
  const PERFECT = 0.1;
  const COLS = 7;
  // Rows: five, or fewer when the frame is short (the pocket), so Pip always has room to fly
  let ROWS = 5;
  const INK = "#1a0b2e";
  // Row colours, top to bottom: pink, ember, yellow, lime, cyan
  const ROWC = ["#ff4f9a", "#ff8a3d", "#ffd23d", "#7dff5a", "#3df5ff"];

  // ---- Pixel art ----------------------------------------------------------------------------
  const BLOCK = {
    sleep: [".bbbbbbbbbb.", "bhhhhhhhhhhb", "bbbbbbbbbbbb", "bbeeebbeeebb", "bpbbbbbbbbpb", "bbbbbbbbbbbb", ".dddddddddd."],
    awake: [".bbbbbbbbbb.", "bhhhhhhhhhhb", "bbbwebbwebbb", "bbbeebbeebbb", "bpbbbmmbbbpb", "bbbbbbbbbbbb", ".dddddddddd."],
    wince: [".bbbbbbbbbb.", "bhhhhhhhhhhb", "bbebbbbbbebb", "bbbebbbbebbb", "bbebbbbbbebb", "bbbbmmmmbbbb", ".dddddddddd."],
    happy: [".bbbbbbbbbb.", "bhhhhhhhhhhb", "bbbebbbbebbb", "bbebebbebebb", "bpbmbbbbmbpb", "bbbbmmmmbbbb", ".dddddddddd."]
  };
  const PIP = {
    open: ["..hhcc..", ".hccccs.", "hceccecs", "hceccecs", "hccccccs", "hcmccmcs", ".scmmcs.", "..ssss.."],
    blink: ["..hhcc..", ".hccccs.", "hccccccs", "hceccecs", "hccccccs", "hcmccmcs", ".scmmcs.", "..ssss.."],
    whee: ["..hhcc..", ".hccccs.", "hceccecs", "hceccecs", "hccccccs", "hcmmmmcs", ".scmmcs.", "..ssss.."]
  };
  const SLAB = ["..tttttttttttttttttt..", ".tppppppppppppppppppt.", "tpLLppppppppppppppLLpt", "tpppppppppppppppppppps", ".dddddddddddddddddddd."];
  const blockPal = (c) => ({ b: c, h: S.mixHex(c, "#ffffff", 0.45), d: S.mixHex(c, "#1a0b2e", 0.5), e: INK, w: "#ffffff", m: INK, p: "#ff9ccf" });
  const PIP_PAL = { c: "#fff4e0", h: "#ffffff", s: "#8fe9ff", e: INK, m: INK };
  const MEGA_PAL = { c: "#ffd23d", h: "#fff6c8", s: "#ff8a3d", e: INK, m: INK };
  const SLAB_PAL = { p: "#9b6bff", t: "#dccbff", d: "#3a1d78", L: "#fff1a8", s: "#6a3fd0" };

  let W = 0, H = 0, F = null, L = {};
  let bricks = []; // { col, row, color, alive, y0 (slide-in from), born, wince, look }
  // Landings are api.track's list ({ at, x, y, state, window } plus target, strong, mega); home is
  // where Pip rests before the first one
  let track = null, home = null;
  const landings = () => [home, ...track.list];
  let pops = [], shards = [], sparks = [], lasers = [];
  let clock = 0, kick = 0, megaNext = false, hits = 0, lastTier = 1, flash = 0;
  let fall = { from: 0, at: -99 }; // the wall sliding down when it refills

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const frac = (v) => v - Math.floor(v);
  const ease = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);

  function layout(api) {
    W = api.W;
    H = api.H;
    F = S.field(W, H);
    const bw = Math.floor((F.w - 24) / COLS);
    // The wall gets what's left once Slab and Pip's flight have their room: the biggest pixel
    // that still fits four rows (three in the smallest frames), at most five rows
    const top = F.y + clamp(F.h * 0.1, 18, 46);
    let k = Math.max(2, Math.floor(bw / 12)), pk, paddleY, rows;
    for (;; k--) {
      pk = Math.max(2, Math.round(k * 0.85));
      paddleY = F.bottom - Math.max(pk * 10 + 8, Math.min(64, F.h * 0.16));
      const room = paddleY - top - Math.max(44, F.h * 0.3);
      rows = Math.min(5, Math.floor(room / (k * 7 + 4)));
      if (k <= 2 || rows >= (F.h < 200 ? 3 : 4)) break;
    }
    rows = Math.max(3, rows);
    L = { bw, bh: k * 7 + (F.h < 400 ? 4 : 5), k, left: F.x + (F.w - bw * COLS) / 2, top, paddleY, pk };
    L.pipR = L.pk * 4;
    L.slabW = 22 * L.pk;
    if (rows !== ROWS) {
      ROWS = rows;
      bricks = [];
    }
    if (!bricks.length) fill(0);
    if (!home) home = { at: -1e6, x: F.x + F.w / 2, state: "hit", target: null };
  }

  const brickX = (b) => L.left + b.col * L.bw + L.bw / 2;
  function brickY(b, now) {
    const base = L.top + b.row * L.bh + L.bh / 2;
    const u = clamp((now - fall.at) / 1.5, 0, 1);
    return base - (1 - ease(u)) * fall.from * L.bh;
  }
  function fill(now) {
    // Refill: everyone left moves down out of the way, a fresh wall slides in from the top
    const alive = bricks.filter((b) => b.alive);
    bricks = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) bricks.push({ col: c, row: r, color: ROWC[r], alive: true, wince: -99, seed: Math.random() * 9 });
    fall = { from: alive.length ? 2 : ROWS + 1, at: now };
  }
  // The lowest Blockling in a column is the one Pip can reach
  function exposed(col) {
    let best = null;
    for (const b of bricks) if (b.alive && b.col === col && (!best || b.row > best.row)) best = b;
    return best;
  }
  function pickTarget() {
    const cols = [];
    for (let c = 0; c < COLS; c++) if (exposed(c)) cols.push(c);
    if (!cols.length) return null;
    return exposed(cols[Math.floor(Math.random() * cols.length)]);
  }

  // Pip at beat position now: on Slab, or up one straight leg to the target and down the other
  function pipAt(now) {
    const lands = landings();
    let a = lands[0], b = null;
    for (const l of lands) {
      if (l.at <= now) a = l;
      else {
        b = l;
        break;
      }
    }
    const rest = (l) => ({ x: l.x, y: L.paddleY - L.pipR - L.pk * 2 - Math.abs(Math.sin(Math.PI * frac(now))) * L.pk * 3, air: false, from: l, to: b });
    if (!b) return rest(a);
    const fly = Math.min(2, b.at - a.at);
    const t0 = b.at - fly;
    if (now < t0) return rest(a);
    const u = (now - t0) / fly;
    const by = L.paddleY - L.pipR - L.pk * 2;
    const tx = a.target ? brickX(a.target) : (a.x + b.x) / 2;
    const ty = a.target ? L.top + a.target.row * L.bh + L.bh + L.pipR * 0.6 : L.top + L.bh * ROWS;
    if (u < 0.5) {
      const v = u * 2;
      return { x: a.x + (tx - a.x) * v, y: by + (ty - by) * v, air: true, up: true, u, from: a, to: b };
    }
    const v = (u - 0.5) * 2;
    return { x: tx + (b.x - tx) * v, y: ty + (by - ty) * v, air: true, up: false, u, from: a, to: b };
  }
  // Slab glides under the next landing while Pip is coming down
  function slabX(now) {
    const p = pipAt(now);
    if (!p.air) return p.x;
    if (p.up) return p.from.x;
    return p.from.x + (p.to.x - p.from.x) * ease((p.u - 0.5) * 2 * 1.25);
  }

  // ---- The five questions ---------------------------------------------------------------------
  function setup(api) {
    // A landing on Slab every beat or two; the tracker spawns, judges, misses and autopilots them
    track = api.track({
      spawn: () => ({ x: F.x + F.w * (0.2 + Math.random() * 0.6), y: L.paddleY, target: null }),
      note: () => (api.style === "fidget" && fidgetAim ? fidgetAim.row / ROWS : 0.3 + Math.random() * 0.4),
      hit: (l, { perfect, ghost }) => {
        resolve(api, l, true, perfect, ghost);
        if (!ghost && ++hits === 16) api.hint("laser", 'Hold <span class="pb-kbd">Space</span>, let go: a laser');
      },
      miss: (l, counted) => {
        resolve(api, l, false, false, true);
        if (counted) api.hint("land", "Tap as Pip lands on Slab");
      },
      perfect: PERFECT,
      // The gold cue closes on the spot where Pip touches down on Slab
      cueAt: (l) => ({ x: l.x, y: L.paddleY - L.pipR - L.pk * 2 }),
      cueSize: 0.8,
      // Pip's flight starts from the last landing, so that one stays until the next is reached
      keep: (l, now) => now - l.at < 6 || !track.list.some((o) => o.at > l.at && o.at <= now)
    });
  }

  // A landing resolved: the bonk aims Pip at a Blockling; a clean one breaks it on arrival
  let fidgetAim = null;
  function resolve(api, l, good, perfect, ghost) {
    l.strong = good;
    l.mega = good && megaNext;
    if (l.mega) megaNext = false;
    if (good) {
      S.shards(shards, l.x, L.paddleY - L.pk * 3, perfect ? 14 : 8, ["#ffffff", "#3df5ff", "#dccbff"], 170, 120);
      if (perfect && !ghost) api.ring(l.x, L.paddleY - L.pk * 2, api.color(), 46);
    }
  }
  // When Pip reaches the top of a leg: break, or plink
  function strike(api, l) {
    const t = l.target;
    if (!t || !t.alive) return;
    if (!l.strong) {
      t.wince = clock;
      S.shards(shards, brickX(t), brickY(t, api.eng.beatPos()) + L.bh / 2, 4, ["#ffffff"], 90, 20);
      return;
    }
    const col = l.mega ? bricks.filter((b) => b.alive && b.col === t.col) : [t];
    for (const b of col) smash(api, b);
    if (l.mega) {
      kick = 1;
      flash = 1;
      api.callout("Mega!", brickX(t), L.top + L.bh * ROWS + 30, "#ff8a3d", 1.3);
      api.eng.chime();
    }
  }
  function smash(api, b) {
    if (!b.alive) return;
    b.alive = false;
    const x = brickX(b), y = brickY(b, api.eng.beatPos());
    pops.push({ x, y, color: b.color, t: 0, vx: (Math.random() - 0.5) * 120, spin: (Math.random() - 0.5) * 3 });
    S.shards(shards, x, y, 14, [b.color, S.mixHex(b.color, "#ffffff", 0.5), "#ffffff"], 200, 80);
    if (bricks.filter((q) => q.alive).length <= COLS) fill(api.eng.beatPos());
  }

  function onFire(api) {
    const now = api.eng.beatPos();
    if (api.style === "fidget") {
      // Every press: a spark off Slab that breaks the nearest reachable Blockling
      fidgetAim = pickTarget();
      if (fidgetAim) sparks.push({ x0: slabX(now), y0: L.paddleY - L.pk * 3, t: fidgetAim, at: now });
    }
    track.fire();
    fidgetAim = null;
  }

  // A hold then release: Slab fires a laser up its column; a full charge fires three
  function onRelease(api, held) {
    const c = api.chargeOf(held);
    if (c <= 0) return;
    const x = slabX(api.eng.beatPos());
    const col0 = clamp(Math.floor((x - L.left) / L.bw), 0, COLS - 1);
    const cols = c >= 1 ? [col0 - 1, col0, col0 + 1] : [col0];
    for (const col of cols) {
      if (col < 0 || col >= COLS) continue;
      lasers.push({ x: L.left + col * L.bw + L.bw / 2, t: 0 });
      const t = exposed(col);
      if (t) smash(api, t);
    }
    if (c >= 1) {
      api.callout("Triple laser", W / 2, H * 0.36, "#3df5ff", 1.1);
      api.eng.chime();
      kick = 0.6;
    }
  }

  let frameDt = 1 / 60;
  function update(dt, api) {
    if (!W) return;
    const now = api.eng.beatPos();
    clock += dt;
    frameDt = dt;
    sky.update(dt);
    for (const l of track.list) if (now >= l.at && l.target === null) l.target = pickTarget();
    // Pip reaches the top of a leg halfway through its flight
    const p = pipAt(now);
    if (p.air && !p.up && !p.from.struck) {
      p.from.struck = true;
      strike(api, p.from);
    }
    for (let i = pops.length - 1; i >= 0; i--) if ((pops[i].t += dt) > 1.1) pops.splice(i, 1);
    for (let i = lasers.length - 1; i >= 0; i--) if ((lasers[i].t += dt) > 0.4) lasers.splice(i, 1);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      if (now - s.at > 0.35) {
        smash(api, s.t);
        sparks.splice(i, 1);
      }
    }
    kick = Math.max(0, kick - dt * 2.5);
    flash = Math.max(0, flash - dt * 2);
    if (api.tier > lastTier) flash = 0.6;
    lastTier = api.tier;
  }

  // ---- The look ---------------------------------------------------------------------------
  // Now and then, far behind the wall: a comet, a firework, a blimp with a sign, the wall tubes
  // flickering pink
  const sky = S.happenings([
    {
      dur: 1.6,
      draw(ctx, e, u) {
        const x0 = e.side > 0 ? F.x - 40 : F.x + F.w + 40, x1 = F.x + F.w / 2 + e.side * F.w * 0.2;
        const y0 = F.y + F.h * (0.05 + e.seed * 0.15), y1 = y0 + F.h * 0.22;
        const v = ease(u), tr = [];
        for (let i = 0; i < 8; i++) {
          const w = Math.max(0, v - i * 0.03);
          tr.push([x0 + (x1 - x0) * w, y0 + (y1 - y0) * w]);
        }
        ctx.globalAlpha = 1 - u;
        S.streak(ctx, tr, 3, "#fff4e0");
      }
    },
    {
      dur: 1.8,
      draw(ctx, e, u) {
        const x = F.x + F.w * (0.2 + e.seed * 0.6), y = F.y + F.h * (0.12 + e.seed * 0.1);
        const c = ROWC[Math.floor(e.seed * 5)];
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = c;
        const r = ease(u) * F.w * 0.12;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * TAU;
          ctx.globalAlpha = (1 - u) * 0.45;
          ctx.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r + u * u * 20), 2, 2);
        }
      }
    },
    {
      dur: 12,
      draw(ctx, e, u) {
        const x = e.side > 0 ? F.x - 60 + u * (F.w + 120) : F.x + F.w + 60 - u * (F.w + 120);
        const y = F.y + F.h * (0.55 + e.seed * 0.08) + Math.sin(u * 9) * 3;
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = "#3a1d78";
        ctx.beginPath();
        ctx.ellipse(x, y, 22, 8, 0, 0, TAU);
        ctx.fill();
        S.text(ctx, frac(clock * 0.8) < 0.5 ? "BONK" : "FREE", x, y + 1, 1, "#ffd23d", { alpha: 0.35, chrome: false });
      }
    },
    {
      dur: 0.9,
      draw(ctx, e, u) {
        if (frac(u * 5) > 0.55) return;
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = "#ff4f9a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(F.x + 8, F.bottom - 30);
        ctx.lineTo(F.x + 8, F.y + 12);
        ctx.lineTo(F.x + F.w - 8, F.y + 12);
        ctx.lineTo(F.x + F.w - 8, F.bottom - 30);
        ctx.stroke();
      }
    }
  ]);

  function backdrop(ctx, api) {
    const hue = api.color();
    S.layer(ctx, "bonk" + api.tier, W, H, (g) => {
      const lin = g.createLinearGradient(0, F.y, 0, F.bottom);
      lin.addColorStop(0, "#0b0620");
      lin.addColorStop(0.7, S.mix("#150a30", hue, 0.08));
      lin.addColorStop(1, S.mix("#1f0d38", hue, 0.18));
      g.fillStyle = lin;
      g.fillRect(0, 0, W, H);
      // A faint pixel horizon of far buildings under Slab, and a starfield of single pixels
      const r = S.rng(11);
      for (let i = 0; i < (F.w * F.h) / 1400; i++) {
        g.fillStyle = r() > 0.8 ? S.rgba(hue, 0.6) : "rgba(255,244,224,0.45)";
        g.globalAlpha = 0.2 + r() * 0.6;
        const s = r() > 0.9 ? 2 : 1;
        g.fillRect(F.x + Math.floor(r() * F.w), F.y + Math.floor(r() * F.h * 0.8), s, s);
      }
      g.globalAlpha = 1;
      const glow = g.createRadialGradient(F.x + F.w / 2, F.bottom, 0, F.x + F.w / 2, F.bottom, F.w * 0.8);
      glow.addColorStop(0, S.rgba(hue, 0.16));
      glow.addColorStop(1, S.rgba(hue, 0));
      g.fillStyle = glow;
      g.fillRect(F.x, F.y, F.w, F.h);
      S.mask(g, F, "#ffffff", 0.035);
      // The walls: neon tubes round three sides of the playfield
      S.haloed(g, "#9b6bff", (g, c, core) => {
        g.strokeStyle = c;
        g.lineWidth = core ? 1.2 : 3;
        g.beginPath();
        g.moveTo(F.x + 8, F.bottom - 30);
        g.lineTo(F.x + 8, F.y + 12);
        g.lineTo(F.x + F.w - 8, F.y + 12);
        g.lineTo(F.x + F.w - 8, F.bottom - 30);
        g.stroke();
      });
      S.sides(g, W, H, F, ROWC.slice(0, 3));
    });
  }

  function drawBrick(ctx, b, now, p) {
    const x = brickX(b), y = brickY(b, now);
    const targeted = p.air && p.up && p.from.target === b;
    const face = clock - b.wince < 0.4 ? "wince" : targeted || (p.to && !p.air && p.from.target === b) ? "awake" : "sleep";
    const bob = Math.sin(now * Math.PI + b.col * 0.7 + b.row) * (face === "sleep" ? 0.6 : 0);
    S.draw(ctx, S.pix(ctx, "blk" + face + b.color, BLOCK[face], blockPal(b.color), L.k, { bloom: 3 }), x, y + bob);
    if (face === "sleep" && (b.col * 3 + b.row * 5) % 11 === Math.floor(now / 2) % 11) {
      const z = frac(now / 2);
      S.text(ctx, "z", x + L.bw * 0.32 + z * 6, y - L.bh * 0.4 - z * 14, 1.5, "#fff4e0", { alpha: (1 - z) * 0.7, chrome: false });
    }
  }

  function draw(ctx, api) {
    const now = api.eng.beatPos();
    const shake = kick * kick * 6;
    ctx.save();
    if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    backdrop(ctx, api);
    if (flash) S.glow(ctx, W / 2, H * 0.4, F.w, "#ff8a3d", flash * 0.25);
    sky.draw(ctx);

    const p = pipAt(now);
    for (const b of bricks) if (b.alive) drawBrick(ctx, b, now, p);

    // Lasers: a column of light from Slab to the ceiling
    for (const z of lasers) {
      const a = 1 - z.t / 0.4;
      ctx.globalCompositeOperation = "lighter";
      for (const [w, al, c] of [[18, 0.15, "#3df5ff"], [6, 0.5, "#3df5ff"], [2, 1, "#ffffff"]]) {
        ctx.globalAlpha = a * al;
        ctx.fillStyle = c;
        ctx.fillRect(z.x - w / 2, F.y + 12, w, L.paddleY - F.y - 12);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    // Fidget sparks
    for (const s of sparks) {
      const u = clamp((now - s.at) / 0.35, 0, 1);
      const tx = brickX(s.t), ty = brickY(s.t, now) + L.bh / 2;
      const x = s.x0 + (tx - s.x0) * u, y = s.y0 + (ty - s.y0) * u;
      S.glow(ctx, x, y, 14, "#ffd23d", 0.9);
      S.twinkle(ctx, x, y, 10, "#fff1a8", 1);
    }
    // Popped Blocklings: happy, tumbling up and away
    for (const q of pops) {
      const u = q.t / 1.1;
      ctx.save();
      ctx.globalAlpha = 1 - u * u;
      ctx.translate(q.x + q.vx * q.t, q.y - 90 * q.t + 160 * q.t * q.t * 0.5 - 40 * q.t);
      ctx.rotate(q.spin * q.t);
      S.draw(ctx, S.pix(ctx, "blkhappy" + q.color, BLOCK.happy, blockPal(q.color), L.k, { bloom: 3 }), 0, 0);
      ctx.restore();
    }
    S.drawShards(ctx, shards, frameDt);

    // Pip, with a light trail in the air; Mega is a fireball
    const mega = p.air && p.from.mega;
    const pc = mega ? "#ff8a3d" : "#3df5ff";
    if (p.air) {
      const trail = [];
      for (let i = 0; i < 9; i++) {
        const q = pipAt(now - i * 0.03);
        trail.push([q.x, q.y]);
      }
      S.streak(ctx, trail.slice(0, mega ? 9 : 6), L.pipR * (mega ? 1.4 : 0.7), pc);
    }
    S.glow(ctx, p.x, p.y, L.pipR * (mega ? 4 : 2.2), pc, mega ? 0.4 : 0.28);
    const blink = frac(clock * 0.31) < 0.04;
    const pipFace = p.air ? "whee" : blink ? "blink" : "open";
    S.draw(ctx, S.pix(ctx, "pip" + pipFace + (mega ? "m" : ""), PIP[pipFace], mega ? MEGA_PAL : PIP_PAL, L.pk, { glow: pc, bloom: 4 }), p.x, p.y);

    // Slab: thrusters underneath, headlight eyes (the shell's gold cue marks the landing)
    const sx = slabX(now), sy = L.paddleY;
    const landed = now - (p.from ? p.from.at : -9);
    const squash = !p.air && landed < 0.25 ? Math.sin((landed / 0.25) * Math.PI) * L.pk * 1.2 : 0;
    for (const s of [-1, 1]) {
      S.glow(ctx, sx + s * L.slabW * 0.32, sy + L.pk * 4, L.pk * (3.5 + Math.sin(clock * 30 + s)), "#9b6bff", 0.55);
      S.glow(ctx, sx + s * L.slabW * 0.32, sy + L.pk * 3.5, L.pk * 1.5, "#fff4e0", 0.5);
    }
    S.draw(ctx, S.pix(ctx, "slab", SLAB, SLAB_PAL, L.pk, { glow: "#9b6bff", bloom: 4 }), sx, sy + squash);
    for (const s of [-1, 1]) S.glow(ctx, sx + s * L.slabW * 0.36, sy, L.pk * 2.5, "#fff1a8", 0.3 + 0.2 * (1 - frac(now)));
    // The charge: a pixel bar filling under Slab
    const c = api.started ? api.charge : 0;
    if (c > 0) {
      const bw = L.slabW * 1.1, color = c >= 1 ? "#ffd23d" : "#3df5ff";
      ctx.fillStyle = "rgba(10,5,20,0.8)";
      ctx.fillRect(sx - bw / 2, sy + L.pk * 7, bw, L.pk * 2);
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = color;
      const cells = Math.floor(c * 11);
      for (let i = 0; i < cells; i++) ctx.fillRect(sx - bw / 2 + 1 + i * (bw / 11), sy + L.pk * 7 + 1, bw / 11 - 2, L.pk * 2 - 2);
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.restore();
  }

  SpaceShell.mount({
    key: "bonk",
    title: "Bonk",
    hint: "Tap as Pip lands on Slab",
    skin: S,
    marquee: S.attract,
    setup,
    engine: {},
    tierNames: ["Finding your rhythm", "Bonk on", "Brick buster", "Wrecking ball"],
    onPhrase: () => (megaNext = true),
    fidgetPoint: (api) => ({ x: slabX(api.eng.beatPos()), y: L.paddleY }),
    resize: layout,
    onFire,
    onRelease,
    update,
    draw
  });
})();
</script>
