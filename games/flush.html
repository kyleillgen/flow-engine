<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="../icon.png">
<meta name="description" content="Plump little meadow birds burst out of the tall grass at sunset, with a clay target now and then. Tap as each one hangs at the top of its rise. A rhythm micro-game that finds your tempo.">
<title>Flush</title>
</head>
<body>
<script src="../engine/flow-engine.js"></script>
<script src="../skins/hunt/hunt-skin.js"></script>
<script src="../shell/space-shell.js"></script>
<script>
// Flush: a meadow of tall grass at sunset. A tuft rustles, then a round little meadow bird bursts
// out and rises, slowing to hang for a moment at the top, on a whole beat, before it glides off.
// Now and then a clay disc is thrown from the trap shed in the corner instead, topping out on the
// beat the same way. The sights glide to the top by themselves; tap as it hangs there. A bird is
// tagged (a flash and a little gold band) and flutters off happy; a clay pops into glowing chips.
// One you miss just flies on or drops into the grass. Nothing is lost.
//
// Paths are functions of the beat position. A bird rises for one beat and eases into the top; a
// clay flies a parabola for a beat and a half up to it. Clean is ±0.3 beat (wider with assist,
// for ones not yet spawned), perfect ±0.1.
// Fidget (F): every press tags the nearest one; if none is near, a bird pops up in the sights.
// Hold then let go: a whistle that lifts a little flock from the grass; a full charge brings a
// skein of geese across the sun. Trick shots never score.
(() => {
  "use strict";

  const S = HuntSkin;
  const TAU = Math.PI * 2;
  const PERFECT = 0.1;
  const SIGHT = "#ff8a3d";
  const GOLD = "#ffd76a";
  const CLAY = "#ff7a2e";
  // Bird plumage: russet, slate, sand
  const BIRDS = [
    { body: "#a8623a", dark: "#5e3018", breast: "#f2cfa0", crest: "#3a2010" },
    { body: "#7a7088", dark: "#3e3848", breast: "#e8d8d0", crest: "#2a2432" },
    { body: "#c4965a", dark: "#7a5428", breast: "#fbe6bf", crest: "#4a3018" }
  ];
  const MOODS = [
    { top: "#2a2654", mid: "#c0607a", low: "#ffc46b", glow: "#ffb36b", orb: "#ffe0a0", orbX: 0.62, orbY: 0.6, orbR: 0.1, stars: 0.15, seed: 4, far: ["#6a3a58", "#4a2840"], grass: ["#5a3a2a", "#2a1a14"], blade: "#c08a50" },
    { top: "#1e1a48", mid: "#8a3a6a", low: "#ff8a52", glow: "#ff9a5c", orb: "#ffc890", orbX: 0.4, orbY: 0.64, orbR: 0.11, stars: 0.4, seed: 12, far: ["#56284a", "#3a1a36"], grass: ["#4a2a28", "#20120f"], blade: "#d08a5a" },
    { top: "#101634", mid: "#3a3a72", low: "#d0808a", glow: "#f0a8a0", orb: "#ffd8b0", orbX: 0.7, orbY: 0.66, orbR: 0.07, stars: 0.9, seed: 20, far: ["#38345e", "#262444"], grass: ["#2e2638", "#141018"], blade: "#a08aa8" },
    { top: "#080c20", mid: "#1c2a50", low: "#4a5878", glow: "#c0d4ff", orb: "#f6f2de", orbX: 0.28, orbY: 0.2, orbR: 0.06, stars: 1.4, seed: 27, far: ["#202c4a", "#161e36"], grass: ["#1a2030", "#0a0c14"], blade: "#8a9ab8" }
  ];

  let W = 0, H = 0, L = {};
  let track = null; // api.track(): track.list holds { kind: "bird" | "clay", at, x0, y0, xa, ya, dir, look, window, state: "wait" | "tag" | "gone", tagAt }
  let chips = [], sparks = [], pops = [], flock = [], skein = null;
  let sinceClay = 0;
  let clock = 0, lastTier = 1, hits = 0;
  let sky = { from: 1, to: 1, t: 1 };
  let prevSpot = null; // where the sights last settled: { x, y, at }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
  const smooth = (u) => u * u * (3 - 2 * u);

  function layout(api) {
    W = api.W;
    H = api.H;
    const b = clamp(Math.min(W, H) * 0.075, 26, 52);
    L = { b, k: b / 36, horizon: H * 0.62, grass: H * 0.74, topLo: Math.max(120, H * 0.24), topHi: H * 0.46, trap: { x: W * 0.07, y: H * 0.8 } };
  }

  // Where something is at beat position `now`
  function posOf(m, now) {
    const t = now - m.at;
    if (m.kind === "clay") {
      // a parabola from the trap shed, flat at the top on its beat, then dropping
      const u = (now - (m.at - 1.5)) / 1.5;
      const x = m.x0 + (m.xa - m.x0) * u;
      const y = m.ya + (m.y0 - m.ya) * (1 - u) * (1 - u);
      return { x, y, t, out: u >= 0, spin: now * 4 };
    }
    if (t < -1) return { x: m.x0, y: m.y0, t, out: false, flap: 0 };
    if (t <= 0) {
      const u = t + 1;
      const e = 1 - (1 - u) * (1 - u);
      return { x: m.x0 + (m.xa - m.x0) * u, y: m.y0 + (m.ya - m.y0) * e, t, out: true, flap: 1 - u * 0.6 };
    }
    // gliding off; a tagged one flutters up in happy little bobs
    const happy = m.state === "tag";
    const x = m.xa + m.dir * W * (happy ? 0.3 : 0.22) * t;
    const y = m.ya - H * (happy ? 0.09 : 0.03) * t + (happy ? Math.sin(t * Math.PI * 2) * L.b * 0.4 : 0);
    return { x, y, t, out: true, flap: happy ? 1 : 0.4 };
  }

  // ---- Sprites --------------------------------------------------------------------------------
  // A round meadow bird, side on and facing right, wings "up" or "down", in units of its radius
  function birdSprite(ctx, kind, wing, r) {
    const B = BIRDS[kind];
    r = Math.round(r);
    return S.sprite(ctx, `bird${kind}${wing}${r}`, r * 3.4, r * 3.4, r * 1.7, r * 1.7, (g) => {
      g.scale(r, r);
      g.lineCap = g.lineJoin = "round";
      const wingPath = (up) => {
        g.beginPath();
        g.moveTo(-0.2, -0.15);
        if (up) {
          g.quadraticCurveTo(-0.5, -1.3, 0.2, -1.4);
          g.quadraticCurveTo(0.2, -0.7, 0.25, -0.15);
        } else {
          g.quadraticCurveTo(-0.8, 0.5, -0.1, 0.95);
          g.quadraticCurveTo(0.2, 0.4, 0.25, -0.05);
        }
        g.closePath();
      };
      // far wing, darker
      g.fillStyle = B.dark;
      g.save();
      g.translate(0.12, -0.05);
      wingPath(wing === "up");
      g.fill();
      g.restore();
      // tail
      g.beginPath();
      g.moveTo(-0.7, -0.1);
      g.lineTo(-1.25, -0.35);
      g.lineTo(-1.2, 0.05);
      g.closePath();
      g.fill();
      const body = g.createRadialGradient(-0.25, -0.35, 0.1, 0, 0, 1);
      body.addColorStop(0, S.mix(B.body, "#ffe0b0", 0.35));
      body.addColorStop(0.6, B.body);
      body.addColorStop(1, B.dark);
      g.fillStyle = body;
      g.beginPath();
      g.ellipse(0, 0, 0.82, 0.72, 0, 0, TAU);
      g.fill();
      g.fillStyle = B.breast;
      g.beginPath();
      g.ellipse(0.3, 0.2, 0.46, 0.42, -0.3, 0, TAU);
      g.fill();
      // speckles
      g.fillStyle = S.rgba(B.dark, 0.6);
      for (const [x, y] of [[-0.35, -0.2], [-0.15, -0.38], [-0.45, 0.1], [0.0, -0.1], [-0.25, 0.25]]) {
        g.beginPath();
        g.ellipse(x, y, 0.06, 0.04, 0.4, 0, TAU);
        g.fill();
      }
      // head: a little crest curl, an eye, a beak
      g.strokeStyle = B.crest;
      g.lineWidth = 0.09;
      g.beginPath();
      g.moveTo(0.42, -0.62);
      g.quadraticCurveTo(0.45, -1.05, 0.72, -0.98);
      g.quadraticCurveTo(0.8, -0.86, 0.66, -0.82);
      g.stroke();
      g.fillStyle = "#1a100a";
      g.beginPath();
      g.arc(0.5, -0.28, 0.1, 0, TAU);
      g.fill();
      g.fillStyle = "#ffffff";
      g.beginPath();
      g.arc(0.47, -0.31, 0.035, 0, TAU);
      g.fill();
      g.fillStyle = "#f0a040";
      g.beginPath();
      g.moveTo(0.78, -0.24);
      g.lineTo(1.02, -0.14);
      g.lineTo(0.78, -0.06);
      g.closePath();
      g.fill();
      // near wing
      const wg = g.createLinearGradient(0, -1.4, 0, 1);
      wg.addColorStop(0, S.mix(B.body, "#ffe0b0", 0.2));
      wg.addColorStop(1, B.dark);
      g.fillStyle = wg;
      wingPath(wing === "up");
      g.fill();
      g.strokeStyle = "rgba(255,220,170,0.45)";
      g.lineWidth = 0.04;
      g.beginPath();
      g.ellipse(0, 0, 0.82, 0.72, 0, Math.PI * 1.1, Math.PI * 1.7);
      g.stroke();
    });
  }
  function claySprite(ctx, r) {
    r = Math.round(r);
    return S.sprite(ctx, "clay" + r, r * 3, r * 3, r * 1.5, r * 1.5, (g) => {
      S.blurred(g, CLAY, 10, (g) => {
        g.fillStyle = S.rgba(CLAY, 0.6);
        g.beginPath();
        g.ellipse(0, 0, r, r * 0.38, 0, 0, TAU);
        g.fill();
      });
      const lin = g.createLinearGradient(0, -r * 0.4, 0, r * 0.4);
      lin.addColorStop(0, "#ffb070");
      lin.addColorStop(0.5, CLAY);
      lin.addColorStop(1, "#8a3410");
      g.fillStyle = lin;
      g.beginPath();
      g.ellipse(0, 0, r, r * 0.38, 0, 0, TAU);
      g.fill();
      g.strokeStyle = "rgba(60,20,8,0.6)";
      g.lineWidth = 1.2;
      g.beginPath();
      g.ellipse(0, -r * 0.05, r * 0.6, r * 0.2, 0, 0, TAU);
      g.stroke();
    });
  }
  function bandSprite(ctx) {
    return S.sprite(ctx, "birdband", 40, 40, 20, 20, (g) =>
      S.haloed(g, GOLD, (g, c, core) => {
        g.strokeStyle = c;
        g.lineWidth = core ? 1.4 : 3;
        g.beginPath();
        g.arc(0, 0, 6, 0, TAU);
        g.stroke();
      })
    );
  }
  // The trap shed: a little plank hut with a slot in its roof
  function shedSprite(ctx, s) {
    s = Math.round(s);
    return S.sprite(ctx, "shed" + s, s * 2.4, s * 2.2, s * 1.2, s * 1.6, (g) => {
      g.fillStyle = "#3a2416";
      g.fillRect(-s, -s * 0.9, s * 2, s * 1.4);
      g.strokeStyle = "rgba(0,0,0,0.3)";
      g.lineWidth = 1;
      for (let i = 1; i < 5; i++) {
        g.beginPath();
        g.moveTo(-s + (i * s * 2) / 5, -s * 0.9);
        g.lineTo(-s + (i * s * 2) / 5, s * 0.5);
        g.stroke();
      }
      g.fillStyle = "#5a3620";
      g.beginPath();
      g.moveTo(-s * 1.15, -s * 0.85);
      g.lineTo(0, -s * 1.45);
      g.lineTo(s * 1.15, -s * 0.85);
      g.closePath();
      g.fill();
      g.strokeStyle = "rgba(255,200,140,0.5)";
      g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(-s * 1.15, -s * 0.85);
      g.lineTo(0, -s * 1.45);
      g.lineTo(s * 1.15, -s * 0.85);
      g.stroke();
      g.fillStyle = "#ffd08a";
      g.fillRect(-s * 0.3, -s * 0.55, s * 0.6, s * 0.35);
    });
  }
  // Tall grass: blades along a band, baked once per mood; the front band sways a little
  function grassSprite(ctx, key, m, h, seed, dark) {
    const w = Math.ceil(W * 1.2);
    return S.sprite(ctx, "grass" + key + w + "x" + Math.round(h), w, h * 1.62, w * 0.1, h * 1.5, (g) => {
      const r = S.rng(seed);
      const lin = g.createLinearGradient(0, -h * 1.4, 0, 0);
      lin.addColorStop(0, dark ? m.grass[0] : S.mix(m.grass[0], m.blade, 0.3));
      lin.addColorStop(1, m.grass[1]);
      g.fillStyle = lin;
      if (!dark) g.fillRect(-w * 0.1, -h * 0.35, w, h * 0.35);
      g.fillStyle = m.grass[1];
      g.fillRect(-w * 0.1, -1, w, h * 0.12);
      g.fillStyle = lin;
      const n = Math.round(w / (dark ? 3.5 : 2.4));
      for (let i = 0; i < n; i++) {
        const x = -w * 0.1 + r() * w, bh = h * (0.5 + r() * 0.9), lean = (r() - 0.5) * bh * 0.5;
        g.beginPath();
        g.moveTo(x - 2.5, 0);
        g.quadraticCurveTo(x - 1, -bh * 0.5, x + lean, -bh);
        g.quadraticCurveTo(x + 1, -bh * 0.5, x + 2.5, 0);
        g.fill();
        if (!dark && r() < 0.15) {
          // a seed head catching the light
          g.fillStyle = S.rgba(m.blade, 0.8);
          g.beginPath();
          g.ellipse(x + lean, -bh, 1.6, 4, lean / bh, 0, TAU);
          g.fill();
          g.fillStyle = lin;
        }
      }
    });
  }

  function skyLayer(ctx, tier, a) {
    const m = MOODS[(tier - 1) % 4];
    ctx.globalAlpha = a;
    S.layer(ctx, "flush" + tier, W, H, (g) => {
      S.duskSky(g, W, H, m);
      g.fillStyle = m.grass[1];
      g.fillRect(0, L.horizon, W, H - L.horizon);
      const lin = g.createLinearGradient(0, L.horizon, 0, L.grass);
      lin.addColorStop(0, m.far[1]);
      lin.addColorStop(0.6, m.grass[0]);
      lin.addColorStop(1, m.grass[1]);
      g.fillStyle = lin;
      g.fillRect(0, L.horizon, W, L.grass - L.horizon);
    });
    ctx.globalAlpha = 1;
  }

  const settle = (m) => {
    const p = { x: m.xa, y: m.ya };
    if (!prevSpot || m.at >= prevSpot.at) prevSpot = { x: p.x, y: p.y, at: m.at };
  };

  // ---- Now and then, behind the play -----------------------------------------------------------
  // One small thing at a time, every few seconds, a different one each time; none of it is a
  // target and none of it crosses where the sights go
  const across = (u, e, pad) => (e.dir > 0 ? -pad + u * (W + 2 * pad) : W + pad - u * (W + 2 * pad));
  const moodNow = () => MOODS[(lastTier - 1) % 4];
  const amb = S.ambience([
    // a heron rowing slowly across, high up
    { dur: 10, draw: (ctx, u, e) => S.critter(ctx, "heron", across(u, e, 60), Math.max(64, H * (0.09 + e.r * 0.05)), L.b * 0.55, u * 10, moodNow().far[1], e.dir) },
    // two deer walk the far edge of the meadow
    { dur: 14, draw: (ctx, u, e) => {
      for (let i = 0; i < 2; i++) S.critter(ctx, "deer", across(u, e, 80) - e.dir * i * L.b * 1.1, L.horizon + H * 0.03, L.b * 0.32 * (1 - i * 0.15), u * 14 + i, S.mix(moodNow().far[1], "#000000", 0.2), e.dir);
    } },
    // a fox trots through, low
    { dur: 7, draw: (ctx, u, e) => S.critter(ctx, "fox", across(u, e, 40), L.horizon + H * 0.06, L.b * 0.26, u * 7, S.mix(moodNow().far[1], "#000000", 0.35), e.dir) },
    // swallows skimming the grass
    { dur: 3.5, draw: (ctx, u, e) => {
      for (let i = 0; i < 3; i++) S.critter(ctx, "bird", across(Math.min(1, u * 1.1 - i * 0.05), e, 40), L.horizon + H * 0.075 + Math.sin(u * 14 + i) * 8, 5 * L.k, u * 6 + i, moodNow().far[1], e.dir);
    } },
    // a shooting star
    { dur: 1.2, draw: (ctx, u, e) => {
      const x0 = W * (0.3 + e.r * 0.6), trail = [];
      for (let j = 0; j < 8; j++) trail.push([x0 - (u - j * 0.03) * W * 0.6 * e.dir, H * 0.06 + (u - j * 0.03) * H * 0.18]);
      S.streak(ctx, trail, 3, "#fff1c0");
    } }
  ]);

  // ---- Effects --------------------------------------------------------------------------------
  function tag(api, m, perfect, ghost) {
    const now = api.eng.beatPos();
    m.state = "tag";
    settle(m);
    m.tagAt = now;
    const p = posOf(m, now);
    pops.push({ x: p.x, y: p.y, t: 0, size: L.b * (perfect ? 2.2 : 1.6), color: perfect ? GOLD : "#fff1dc" });
    if (m.kind === "clay") {
      // the clay pops into glowing chips that tumble down into the grass
      for (let i = 0; i < 7 && chips.length < 80; i++) {
        const a = -Math.PI * (0.1 + 0.8 * (i / 6)), v = 80 + Math.random() * 120;
        chips.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 14, life: 1.2 });
      }
    }
    for (let i = 0; i < (perfect ? 12 : 8) && sparks.length < 160; i++) {
      const a = Math.random() * TAU, v = 50 + Math.random() * 110, life = 0.5 + Math.random() * 0.5;
      sparks.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life, max: life, color: i % 3 ? GOLD : "#fff1dc", star: i % 3 === 0 });
    }
    if (perfect && !ghost) api.ring(p.x, p.y, GOLD, L.b * 2.2);
    return { x: p.x, y: p.y - L.b * 1.6 }; // where the shell pops the points
  }

  // ---- The five questions ---------------------------------------------------------------------
  // 1. On the beat: something tops out `ahead` beats from now, two or more after the last
  function spawn() {
    const clay = ++sinceClay >= 3 && Math.random() < 0.4;
    if (clay) {
      sinceClay = 0;
      const right = Math.random() < 0.5;
      const x0 = right ? W - L.trap.x : L.trap.x;
      const xa = W * (right ? 0.38 + Math.random() * 0.2 : 0.42 + Math.random() * 0.2);
      return { kind: "clay", x0, y0: L.trap.y - L.b * 1.2, xa, ya: L.topLo + Math.random() * (L.topHi - L.topLo) * 0.6, dir: right ? -1 : 1, tagAt: -99 };
    } else {
      const x0 = W * (0.22 + Math.random() * 0.56);
      const dir = x0 < W / 2 ? 1 : -1;
      return { kind: "bird", x0, y0: L.grass + L.b * 0.6, xa: x0 + dir * W * 0.1, ya: L.topLo + Math.random() * (L.topHi - L.topLo), dir, look: Math.floor(Math.random() * BIRDS.length), tagAt: -99 };
    }
  }

  // 3. A tap: the tracker tags whatever is in reach. In Fidget, with nothing within 1 beat,
  // one springs up right in the sights instead (from the tracker's empty())
  function springUp(api) {
    if (track.list.length >= 14) return;
    const now = api.eng.beatPos();
    const sp = sights(now);
    const dir = sp.x < W / 2 ? 1 : -1;
    const m = { kind: "bird", at: now, x0: sp.x - dir * W * 0.1, y0: L.grass + L.b, xa: sp.x, ya: sp.y, dir, look: Math.floor(Math.random() * BIRDS.length), state: "wait", tagAt: -99, window: 0 };
    track.list.push(m);
    tag(api, m, false, true);
  }

  // The arrive-on-the-beat loop is the shell's: it spawns, judges, scores, misses and plays
  // autopilot, and the game says what arrives and how a tag looks
  function setup(api) {
    track = api.track({
      spawn,
      ready: (m, now) => Math.abs(m.at - now) < 1,
      note: (m) => m.kind === "clay" ? 0.1 : 0.35 + m.look * 0.15,
      hit: (m, { perfect, ghost }) => {
        const at = tag(api, m, perfect, ghost);
        if (!ghost && ++hits === 16) api.hint("whistle", 'Hold <span class="pb-kbd">Space</span>, let go: a whistle');
        return at;
      },
      miss: (m, counted) => {
        m.state = "gone";
        settle(m);
        if (counted) api.hint("hang", "Tap as it hangs at the top");
      },
      empty: () => {
        if (api.style === "fidget") return springUp(api);
        const sp = sights(api.eng.beatPos());
        pops.push({ x: sp.x, y: sp.y, t: 0, size: L.b, color: SIGHT });
      },
      perfect: PERFECT,
      cue: false, // the sights carry the timing ring, gold on the perfect beat (see draw)
      keep: (m, now) => {
        if (m.state === "tag" && m.kind === "clay") return now - m.tagAt < 1;
        const p = posOf(m, now);
        return !(now > m.at + 0.5 && (p.x < -L.b * 3 || p.x > W + L.b * 3 || p.y < -L.b * 3 || p.y > H + L.b * 2));
      } // until it's off screen
    });
  }

  // A hold then release: a little flock lifts out of the grass; a full charge brings geese over
  function onRelease(api, held) {
    const c = api.chargeOf(held);
    if (c <= 0) return;
    const n = Math.round(4 + c * 8);
    for (let i = 0; i < n && flock.length < 40; i++) flock.push({ x: W * (0.1 + Math.random() * 0.8), y: L.grass, vx: (Math.random() - 0.5) * 160, vy: -120 - Math.random() * 120, t: 0, seed: Math.random() * 6 });
    if (c >= 1) {
      skein = { t: 0, dir: Math.random() < 0.5 ? 1 : -1 };
      api.callout("Geese overhead", W / 2, H * 0.3, GOLD, 1.2);
      api.eng.chime();
    }
  }

  // The sights glide from the last top to the next and settle a moment before it
  function sights(now) {
    let next = null;
    for (const m of track.list) if (m.state === "wait" && now < m.at + m.window && (!next || m.at < next.at)) next = m;
    const from = prevSpot || { x: W * 0.5, y: (L.topLo + L.topHi) / 2 };
    if (!next) return { x: from.x, y: from.y, lock: 0, next: null };
    const start = Math.max(prevSpot ? prevSpot.at : -1e9, next.at - 1.8), end = next.at - 0.35;
    const u = end > start ? smooth(clamp((now - start) / (end - start), 0, 1)) : 1;
    return { x: from.x + (next.xa - from.x) * u, y: from.y + (next.ya - from.y) * u, lock: clamp(1 - Math.abs(next.at - now) / 1.2, 0, 1), next };
  }

  // 2. Movement and misses
  function update(dt, api) {
    if (!W) return;
    const now = api.eng.beatPos();
    clock += dt;
    amb.update(dt);
    const drag = Math.pow(0.2, dt);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.vx *= drag;
      p.vy = p.vy * drag + 30 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if ((p.life -= dt) <= 0) sparks.splice(i, 1);
    }
    for (let i = chips.length - 1; i >= 0; i--) {
      const p = chips[i];
      p.vy += 420 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if ((p.life -= dt) <= 0 || p.y > L.grass + 20) chips.splice(i, 1);
    }
    for (let i = flock.length - 1; i >= 0; i--) {
      const f = flock[i];
      f.t += dt;
      f.vy += 30 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.t > 4 || f.y < -20) flock.splice(i, 1);
    }
    if (skein && (skein.t += dt) > 6) skein = null;
    for (let i = pops.length - 1; i >= 0; i--) if ((pops[i].t += dt) > 0.6) pops.splice(i, 1);
    if (api.tier !== lastTier) sky = { from: sky.t < 1 ? sky.to : lastTier, to: api.tier, t: 0 };
    lastTier = api.tier;
    sky.t = Math.min(1, sky.t + dt / 2.5);
  }

  // 5. The look
  function flyer(ctx, x, y, s, flap, color) {
    // a far bird: two curved strokes
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.2, s * 0.18);
    ctx.lineCap = "round";
    const w = Math.sin(flap) * s * 0.5;
    ctx.beginPath();
    ctx.moveTo(x - s, y - w);
    ctx.quadraticCurveTo(x - s * 0.4, y - s * 0.4 - w * 0.4, x, y);
    ctx.quadraticCurveTo(x + s * 0.4, y - s * 0.4 - w * 0.4, x + s, y - w);
    ctx.stroke();
  }

  function drawThing(ctx, m, now, api) {
    const p = posOf(m, now);
    if (m.kind === "clay") {
      if (!p.out || m.state === "tag") return;
      S.glow(ctx, p.x, p.y, L.b * 1.6, CLAY, 0.25);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.sin(p.spin) * 0.25);
      ctx.scale(1, 0.7 + 0.3 * Math.abs(Math.cos(p.spin)));
      S.draw(ctx, claySprite(ctx, L.b * 0.62), 0, 0);
      ctx.restore();
      return;
    }
    if (!p.out) return;
    const wing = Math.sin(now * Math.PI * (m.state === "tag" ? 8 : 6) * p.flap + m.x0) > 0 ? "up" : "down";
    const tilt = p.t < 0 ? -0.3 * (1 + p.t) : m.state === "tag" ? -0.2 : 0.05;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(m.dir, 1);
    ctx.rotate(tilt);
    S.draw(ctx, birdSprite(ctx, m.look, p.flap < 0.45 && p.t > 0 ? "down" : wing, L.b * 0.62), 0, 0);
    if (m.state === "tag") {
      const since = now - m.tagAt;
      S.add(ctx, bandSprite(ctx), L.b * 0.2, -L.b * 0.05, L.k * (0.9 + 0.5 * Math.max(0, 1 - since * 2)), 1);
    }
    ctx.restore();
    if (m.state === "tag" && p.t > 0.2) {
      for (let i = 0; i < 3; i++) {
        const q = posOf(m, now - 0.07 * (i + 1));
        S.twinkle(ctx, q.x, q.y, L.b * 0.4 * (1 - i * 0.25), GOLD, 0.55 - i * 0.15);
      }
    }
  }

  function draw(ctx, api) {
    const now = api.eng.beatPos();
    const mood = MOODS[(api.tier - 1) % 4];
    if (sky.t < 1) skyLayer(ctx, sky.from, 1);
    skyLayer(ctx, sky.to, sky.t < 1 ? ease(sky.t) : 1);
    S.pines(ctx, "fl" + api.tier, W, L.horizon, H * 0.12, now * W * 0.003, mood.far, mood.glow, 8, 22);
    amb.draw(ctx);
    if (skein) {
      // a V of geese across the sky
      const u = skein.t / 6;
      const cx = skein.dir > 0 ? -W * 0.2 + u * W * 1.4 : W * 1.2 - u * W * 1.4, cy = H * 0.22 - u * H * 0.05;
      for (let i = -4; i <= 4; i++) flyer(ctx, cx - skein.dir * Math.abs(i) * 18 * L.k, cy + i * 11 * L.k, 7 * L.k, skein.t * 7 + Math.abs(i), S.rgba(mood.far[1], 0.95));
    }
    // the back grass, whatever is rising, the trap shed, then the front grass swaying on the beat
    S.draw(ctx, grassSprite(ctx, "back" + api.tier, mood, H * 0.05, 31, true), 0, L.grass - H * 0.015);
    S.draw(ctx, grassSprite(ctx, "mid" + api.tier, mood, H * 0.06, 39, true), 0, H * 0.86);
    for (const m of track.list) if (m.kind === "bird" || m.state !== "tag") drawThing(ctx, m, now, api);
    const trapX = (track.list.find((m) => m.kind === "clay" && m.state === "wait") || {}).x0;
    S.draw(ctx, shedSprite(ctx, L.b * 0.7), L.trap.x, L.trap.y);
    S.draw(ctx, shedSprite(ctx, L.b * 0.7), W - L.trap.x, L.trap.y);
    if (trapX !== undefined) S.glow(ctx, trapX, L.trap.y - L.b * 0.6, L.b, "#ffd08a", 0.5 + 0.3 * Math.sin(now * TAU));
    // rustling tufts where a bird is about to flush
    for (const m of track.list) {
      if (m.kind !== "bird" || m.state !== "wait") continue;
      const left = m.at - 1 - now;
      if (left > 1 || left < -0.3) continue;
      const k = clamp(1 - left, 0, 1);
      ctx.strokeStyle = S.rgba(mood.blade, 0.9);
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      for (let i = -2; i <= 2; i++) {
        const sway = Math.sin(now * 22 + i) * 6 * k;
        ctx.beginPath();
        ctx.moveTo(m.x0 + i * 6, L.grass + 10);
        ctx.quadraticCurveTo(m.x0 + i * 7, L.grass - 8, m.x0 + i * 9 + sway, L.grass - 18 - k * 8);
        ctx.stroke();
      }
    }
    ctx.save();
    const sway = Math.sin(now * Math.PI) * 0.02;
    ctx.transform(1, 0, sway, 1, -sway * H, 0);
    S.draw(ctx, grassSprite(ctx, "front" + api.tier, mood, H * 0.1, 47, false), 0, H + 4);
    ctx.restore();
    for (const p of chips) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = CLAY;
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.beginPath();
      ctx.moveTo(-5 * L.k, -2 * L.k);
      ctx.lineTo(5 * L.k, -3 * L.k);
      ctx.lineTo(1 * L.k, 3 * L.k);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      S.glow(ctx, p.x, p.y, 7 * L.k, CLAY, Math.min(1, p.life) * 0.6);
    }
    for (const f of flock) flyer(ctx, f.x, f.y, 6 * L.k, f.t * 14 + f.seed, mood.grass[1]);

    // The sights
    const sp = sights(now);
    const perfectNow = sp.next && Math.abs(sp.next.at - now) < PERFECT;
    S.reticle(ctx, sp.x, sp.y, L.b * 1.1, perfectNow ? GOLD : SIGHT, sp.lock, api.started ? 1 : 0.8);
    if (sp.next) {
      const left = sp.next.at - now;
      if (left < 1.5 && left > -sp.next.window) S.softRing(ctx, sp.x, sp.y, L.b * 0.5 + Math.max(0, left) * L.b * 2, perfectNow ? GOLD : SIGHT, Math.min(1, (1.5 - left) / 0.5) * 0.8, 1.2);
    }
    api.drawCharge(sp.x, sp.y, L.b * 1.6, SIGHT, GOLD);
    for (const p of pops) {
      const e = Math.min(1, p.t / 0.5);
      S.glow(ctx, p.x, p.y, p.size * (0.6 + e), p.color, (1 - e) * 0.8);
      S.softRing(ctx, p.x, p.y, p.size * 0.3 + p.size * 0.6 * ease(e), p.color, (1 - e) * 0.8, 1.4);
    }
    for (const p of sparks) {
      const a = p.life / p.max;
      if (p.star) S.twinkle(ctx, p.x, p.y, 7 * L.k, p.color, a);
      else S.glow(ctx, p.x, p.y, 5 * L.k, p.color, a);
    }
    S.motes(ctx, W, H, clock, ["#ffe08a", "#fff1c0"], { n: 8, size: 5, rise: 8, sway: 18, par: 0, alpha: 0.35, seed: 13 });
  }

  SpaceShell.mount({
    skin: S,
    key: "flush",
    title: "Flush",
    hint: "Tap as each bird hangs at the top",
    engine: {},
    tierNames: ["Finding your rhythm", "Tall grass", "Sundown", "Night meadow"],
    fidgetPoint: (api) => {
      const sp = sights(api.eng.beatPos());
      return { x: sp.x, y: sp.y };
    },
    resize: layout,
    setup,
    onFire: () => track.fire(),
    onRelease,
    update,
    draw
  });
})();
</script>
</body>
</html>
